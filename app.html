<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时迹 · 个人事件生命线</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ================= 基础 ================= */
:root{
  --bg:#F6F4EE; --bg2:#FBFAF6; --ink:#1E1C19; --ink2:#4B473F; --muted:#8C867B;
  --line:#E2DCD0; --line2:#EDE9E0;
  --shadow:0 1px 2px rgba(40,35,25,.05), 0 10px 28px -14px rgba(40,35,25,.20);
  --topbar:76px; --lanehdr:66px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:'Noto Sans SC',-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 12% -12%, #FFFDF8 0%, rgba(255,253,248,0) 62%),
    radial-gradient(900px 500px at 100% 100%, #F2EFE6 0%, rgba(242,239,230,0) 65%),
    var(--bg);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0;}
input,textarea,select{font-family:inherit;}

/* ================= 顶栏 ================= */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:60;
  display:flex;align-items:center;gap:16px;padding:0 22px;
  border-bottom:1px solid var(--line);background:rgba(251,250,246,.92);backdrop-filter:blur(12px);
}
.brand{display:flex;align-items:center;gap:11px;flex:none;color:inherit;text-decoration:none;cursor:pointer;transition:opacity .18s;}
.brand:hover{opacity:.72;}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:#F6F4EE;display:grid;place-items:center;font-size:13px;flex:none;}
.brand .mark svg{width:15px;height:15px;display:block;}
.brand h1{font-family:'Noto Serif SC',serif;font-size:19px;letter-spacing:.12em;margin:0;font-weight:600;line-height:1.15;}
.brand .sub{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:3px;}

.stats{display:flex;gap:6px;align-items:center;flex:none;}
.stat{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);padding:4px 9px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);white-space:nowrap;}
.stat b{font-weight:600;font-variant-numeric:tabular-nums;}
.stat i{width:6px;height:6px;border-radius:50%;font-style:normal;}

.spacer{flex:1;}
.today-txt{font-size:11.5px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;flex:none;cursor:pointer;display:flex;align-items:center;}
.back-today{border:1px solid var(--line);border-radius:11px;padding:1px 8px;margin-left:7px;color:var(--ink2);font-size:10.5px;background:var(--bg2);}
.today-txt:hover .back-today{background:#fff;border-color:#C9C2B3;}

.views{display:flex;gap:1px;padding:3px;border:1px solid var(--line);border-radius:18px;background:var(--bg2);flex:none;}
.views button{font-size:11.5px;padding:5px 9px;border-radius:15px;color:var(--muted);transition:.15s;}
.views button.on{background:var(--ink);color:#F8F6F0;}
.views button:hover:not(.on){color:var(--ink);}

.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:17px;background:var(--bg2);width:178px;transition:width .18s,border-color .18s;flex:none;}
.search:focus-within{width:224px;border-color:#B9B1A0;background:#fff;}
.search svg{width:12px;height:12px;opacity:.45;flex:none;}
.search input{border:none;outline:none;background:none;font-size:11.5px;width:100%;color:var(--ink);}
.search input::placeholder{color:#B5AFA3;}

.btn-primary{display:flex;align-items:center;gap:6px;background:var(--ink);color:#F8F6F0;padding:8px 15px;border-radius:20px;font-size:12.5px;box-shadow:0 6px 16px -8px rgba(30,28,25,.55);transition:.18s;flex:none;}
.btn-primary:hover{transform:translateY(-1px);}
.btn-primary span{font-size:14px;line-height:1;}

.menu-wrap{position:relative;flex:none;}
.menu-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;font-size:15px;color:var(--ink2);}
.menu-btn:hover{background:#EFEBE1;}
.menu-btn.active{background:var(--ink);color:#F8F6F0;border-color:var(--ink);}

/* 设置面板 */
.panel{
  position:fixed;top:86px;right:18px;width:306px;max-height:calc(100vh - 108px);overflow:auto;z-index:65;
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 60px -30px rgba(30,28,25,.45);
  padding:6px;display:none;
}
.panel.open{display:block;}
.pgroup{padding:10px 12px 12px;border-bottom:1px solid var(--line2);}
.pgroup:last-child{border-bottom:none;}
.pgroup h5{font-size:10px;letter-spacing:.16em;color:var(--muted);margin:0 0 8px;font-weight:500;}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12px;color:var(--ink2);}
.prow > span{color:var(--muted);font-size:11.5px;}
.seg{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:14px;background:var(--bg);}
.seg button{font-size:11px;padding:3px 8px;border-radius:11px;color:var(--muted);}
.seg button.on{background:var(--ink);color:#F8F6F0;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--ink2);display:grid;place-items:center;}
.stepper b{font-size:11.5px;font-weight:500;width:30px;text-align:center;}
.panel select,.panel input[type=date]{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11.5px;background:#fff;color:var(--ink);outline:none;max-width:150px;}
.panel .pbtn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11.5px;background:var(--bg);color:var(--ink2);}
.panel .pbtn:hover{background:#fff;}
.switch{width:34px;height:18px;border-radius:10px;background:#DCD6C8;position:relative;cursor:pointer;transition:.18s;flex:none;}
.switch.on{background:var(--ink);}
.switch i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;}
.switch.on i{left:18px;}
.pmenu{display:flex;flex-direction:column;gap:4px;}
.pmenu button{text-align:left;padding:7px 10px;border-radius:8px;font-size:12px;color:var(--ink2);}
.pmenu button:hover{background:#F1EDE3;}
.pmenu button.danger{color:#B4453A;}

/* ================= 轨道标题（固定） ================= */
.laneHdr{
  position:fixed;left:0;right:0;top:var(--topbar);height:var(--lanehdr);z-index:55;
  display:flex;border-bottom:1px solid var(--line);background:rgba(248,246,240,.94);backdrop-filter:blur(10px);
}
.lhGutter{width:var(--gutter,112px);flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 12px;gap:2px;}
.lhGutter span{font-size:9.5px;letter-spacing:.2em;color:var(--muted);}
.lhGTop{display:flex;align-items:center;justify-content:space-between;gap:6px;}
/* 左上角年份：随滚动位置更新，以当前可见日期所属年份为准 */
.yh-year{font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:.06em;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums;flex:none;background:var(--bg2);}
.yh-year.is-now{background:var(--ink);color:#F8F6F0;border-color:var(--ink);}
.lhGutter b{font-size:12px;font-weight:600;color:var(--ink2);}
.lhView{flex:1;overflow:hidden;position:relative;}
.lhTracks{position:absolute;left:0;top:0;height:100%;will-change:transform;}
.lhCard{
  position:absolute;top:8px;height:50px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);
  border-left:3px solid var(--c);padding:5px 8px 5px 9px;overflow:hidden;cursor:grab;user-select:none;transition:box-shadow .15s,transform .15s;
}
.lhCard:hover{box-shadow:0 6px 18px -12px rgba(40,35,25,.5);}
.lhCard.sel{box-shadow:0 0 0 2px var(--c);}
.lhCard.drag{opacity:.6;cursor:grabbing;}
.lhCard .lhTop{display:flex;align-items:center;gap:5px;}
.lhCard .lhDot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;}
.lhCard .lhName{font-size:11.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.lhCard .lhMeta{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.lhCard .lhMeta .st{color:var(--c);}
.lhBtns{display:flex;gap:2px;flex:none;}
.lhBtns button{width:18px;height:18px;border-radius:6px;font-size:9.5px;color:var(--muted);display:grid;place-items:center;}
.lhBtns button:hover{background:#EFEBE1;color:var(--ink);}
.lhBtns button.on{color:var(--ink);background:#EFEBE1;}
.lhCard.collapsed .lhName{display:none;}
.lhCard.collapsed .lhTop{justify-content:center;gap:4px;}
.lhCard.collapsed .lhBtns [data-iso]{display:none;}
.lhCard.collapsed .lhBtns [data-collapse]{width:20px;height:20px;font-size:11px;color:var(--ink);}
.lhCard.collapsed:hover .lhBtns [data-collapse]{background:#EFEBE1;}
.lhCard.collapsed{cursor:zoom-in;}

/* ================= 画布 ================= */
.stage{position:fixed;top:calc(var(--topbar) + var(--lanehdr));left:0;right:0;bottom:0;overflow:auto;overscroll-behavior:contain;}
.stage::-webkit-scrollbar{width:10px;height:10px;}
.stage::-webkit-scrollbar-thumb{background:#DCD6C8;border-radius:6px;border:2px solid var(--bg);}
#canvas{position:relative;min-width:100%;}

.grid{position:absolute;inset:0;z-index:0;pointer-events:none;}
.week-line{position:absolute;left:0;right:0;height:1px;background:repeating-linear-gradient(to right,#E6E1D6 0 4px,transparent 4px 9px);}
.month-line{position:absolute;left:0;right:0;height:1px;background:#D6CFC0;}
.q-line{position:absolute;left:0;right:0;height:1px;background:#C9C1B0;}
.today-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,rgba(30,28,25,.75),rgba(30,28,25,.35) 70%,rgba(30,28,25,.15));}
.today-glow{position:absolute;left:0;right:0;height:14px;background:linear-gradient(to bottom,rgba(30,28,25,.045),transparent);}
.replay-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,rgba(111,98,168,.75),rgba(111,98,168,.25));}

/* 日期栏（固定左侧） */
.gutter{position:sticky;left:0;z-index:12;width:var(--gutter,112px);float:left;background:linear-gradient(to right,var(--bg) 82%,rgba(246,244,238,.9) 100%);}
.spine{position:absolute;left:calc(var(--gutter,112px) - 8px);top:0;bottom:0;width:1px;background:var(--line);}
.spine-label{position:absolute;left:0;top:8px;width:calc(var(--gutter,112px) - 16px);text-align:right;font-size:9px;letter-spacing:.2em;color:var(--muted);}
.day-cell{position:absolute;left:0;width:calc(var(--gutter,112px) - 8px);display:flex;align-items:center;justify-content:flex-end;gap:5px;padding-right:12px;cursor:pointer;}
.day-cell:hover{background:rgba(30,28,25,.05);}
/* 悬停日期 → 整行高亮（日期栏加深 + 画布整行色带） */
.day-cell.hover{background:rgba(30,28,25,.07);}
.day-cell.hover .day-num{font-weight:700;color:var(--ink);}
.day-cell.hover .day-wd{color:var(--ink2);}
.day-cell.is-today{background:rgba(30,28,25,.06);}
.day-cell.is-today .day-num{color:var(--ink);font-weight:700;}
.day-num{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2);width:22px;text-align:right;}
.day-wd{font-size:9px;color:#B3ADA1;width:26px;}
.day-cell.is-weekend .day-wd{color:#C3B49F;}
.month-tag{position:absolute;left:0;width:60px;text-align:left;font-family:'Noto Serif SC',serif;font-size:11px;color:var(--ink);letter-spacing:.03em;padding-left:7px;white-space:nowrap;}
.month-tag em{font-style:normal;font-size:9.5px;color:var(--muted);margin:0 1px;}
.year-tag{position:absolute;left:0;width:60px;text-align:left;font-family:'Noto Serif SC',serif;font-size:9.5px;color:var(--muted);padding-left:7px;white-space:nowrap;letter-spacing:.05em;}
.today-badge{position:absolute;left:4px;padding:1px 6px;border-radius:9px;background:var(--ink);color:#F8F6F0;font-size:9.5px;letter-spacing:.08em;z-index:14;}

/* 连线 */
.links{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible;}
.relhit{pointer-events:stroke;cursor:pointer;}
.link-label{position:absolute;z-index:2;transform:translate(-50%,-50%);pointer-events:none;font-size:10px;color:var(--ink2);background:rgba(251,250,246,.95);border:1px solid var(--line);padding:2px 7px;border-radius:9px;white-space:nowrap;letter-spacing:.04em;}

/* 泳道 */
.lanes{position:absolute;inset:0;z-index:3;}
.lane{position:absolute;top:0;bottom:0;}
.lane.sel .chip{box-shadow:0 0 0 2px var(--c),var(--shadow);}
.dur-band{position:absolute;border-radius:4px;background:var(--c);opacity:.09;}
.ribbon{position:absolute;border-radius:3px;background:var(--c);transition:opacity .2s;}

.ribbon.ended{opacity:.6;}
/* 生命周期标记：开始=绿圆▶ / 结束=红圆■ / 进行中尾部=蓝圆↓ */
.mk{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);z-index:6;
  display:grid;place-items:center;box-shadow:0 1px 4px -1px rgba(30,28,25,.35);}
.mk svg{width:18px;height:18px;display:block;pointer-events:none;}
.mk-start{background:#139A62;}
.mk-end{background:#D93F3A;cursor:pointer;}
.mk-live{background:#2F72E4;animation:mkPulse 2.4s ease-out infinite;}
@keyframes mkPulse{0%{box-shadow:0 1px 4px -1px rgba(30,28,25,.35),0 0 0 0 rgba(47,114,228,.35);}70%{box-shadow:0 1px 4px -1px rgba(30,28,25,.35),0 0 0 11px rgba(47,114,228,0);}100%{box-shadow:0 1px 4px -1px rgba(30,28,25,.35),0 0 0 0 rgba(47,114,228,0);}}
.mk:hover{transform:translate(-50%,-50%) scale(1.12);}
.end-cap{position:absolute;z-index:5;white-space:nowrap;font-size:9.5px;color:var(--muted);}
.end-cap b{font-weight:500;}

.chip{
  position:absolute;background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--c);
  border-radius:9px;padding:6px 9px 7px;box-shadow:0 2px 10px -8px rgba(40,35,25,.4);z-index:6;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.chip:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.chip.compact{padding:4px 8px;border-radius:8px;}
.chip.compact .chip-title{font-size:10.5px;-webkit-line-clamp:1;line-height:1.4;}
.chip-main{display:flex;align-items:center;gap:5px;}
.chip-dot{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;}
.chip-title{font-size:12px;font-weight:600;letter-spacing:.01em;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.chip-sub{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;}
.chip-tag{font-size:9px;letter-spacing:.06em;padding:0 5px;border-radius:6px;background:rgba(30,28,25,.06);color:var(--ink2);}
.chip-tag.live{background:var(--c15);color:var(--c);}
.chip-tag.ended{background:rgba(30,28,25,.05);color:#8C867B;}
.pin-mark{position:absolute;top:-6px;right:-4px;font-size:9px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:50%;width:15px;height:15px;display:grid;place-items:center;}

.node{position:absolute;width:11px;height:11px;transform:translate(-50%,-50%);z-index:7;cursor:grab;}
.node i{display:block;width:11px;height:11px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--c);transition:.16s;}
.node:hover i{transform:scale(1.45);background:var(--c);box-shadow:0 0 0 4px var(--c15);}
.node.dragging i{transform:scale(1.8);background:var(--c);box-shadow:0 0 0 5px var(--c15);}
.node.focus i{background:var(--c);box-shadow:0 0 0 3px var(--c15);}
.node-label{position:absolute;z-index:7;cursor:pointer;font-size:10.5px;color:var(--ink2);display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden;}
.node-label .nd{color:var(--c);font-variant-numeric:tabular-nums;font-size:9.5px;flex:none;opacity:.9;}
.node-label .nt{overflow:hidden;text-overflow:ellipsis;min-width:0;}
.node-label .nx{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;}
.node-label.focus .nt{font-weight:600;color:var(--ink);}
.node-label.hit .nt{background:linear-gradient(transparent 58%,var(--c15) 58%);font-weight:600;}
.node-label.detail{display:block;line-height:1.35;}
.node-label.detail .nd{display:inline;margin-right:5px;}
.node-label.detail .nx{display:block;margin-top:1px;max-width:100%;}

.hit{position:absolute;width:26px;cursor:crosshair;z-index:2;}
.hit:hover{background:linear-gradient(to bottom,transparent,var(--c15),transparent);}
.hover-band{position:absolute;left:0;right:0;height:0;opacity:0;z-index:1;pointer-events:none;
  background:rgba(30,28,25,.045);border-top:1px solid rgba(30,28,25,.14);border-bottom:1px solid rgba(30,28,25,.08);
  transition:opacity .1s ease;}
.drag-tag{position:fixed;z-index:80;transform:translate(-50%,-175%);background:var(--ink);color:#F8F6F0;font-size:11px;padding:3px 9px;border-radius:9px;pointer-events:none;font-variant-numeric:tabular-nums;box-shadow:0 6px 16px -8px rgba(30,28,25,.6);}

.lane.collapsed .chip,.lane.collapsed .node-label,.lane.collapsed .end-cap{display:none;}
.lane.collapsed .node i{width:8px;height:8px;border-width:1.2px;}
.lane.collapsed .mk{width:15px;height:15px;}
.lane.collapsed .mk svg{width:15px;height:15px;}
.lane.collapsed .mk-start{margin-top:1px;}
.lane.is-ended .node-label{opacity:.8;}
.lane.is-ended .chip{opacity:.9;}
.lane.is-ended .dur-band{opacity:.05;}
.collapse-bar{position:absolute;top:0;bottom:0;width:100%;}
.collapse-count{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);background:rgba(251,250,246,.9);border:1px solid var(--line);border-radius:8px;padding:1px 6px;}

/* ================= 抽屉 ================= */
.drawer{
  position:fixed;top:calc(var(--topbar) + var(--lanehdr));right:0;bottom:0;width:404px;z-index:52;background:var(--bg2);border-left:1px solid var(--line);
  transform:translateX(103%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-30px 0 60px -40px rgba(40,35,25,.4);
}
.drawer.open{transform:none;}
.drawer-head{padding:20px 22px 14px;border-bottom:1px solid var(--line2);position:relative;}
.drawer-head .row1{display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:.16em;color:var(--muted);}
.drawer-head h2{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:600;margin:9px 0 0;letter-spacing:.03em;line-height:1.35;padding-right:28px;}
.drawer-head .desc{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:6px;}
.drawer-close{position:absolute;top:16px;right:14px;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:14px;display:grid;place-items:center;}
.drawer-close:hover{background:#EFEBE1;color:var(--ink);}
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line2);border-bottom:1px solid var(--line2);}
.meta-grid>div{background:var(--bg2);padding:10px 15px;}
.meta-grid span{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px;}
.meta-grid b{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px;border-bottom:1px solid var(--line2);}
.acts button{font-size:11px;padding:5px 10px;border-radius:15px;border:1px solid var(--line);color:var(--ink2);background:var(--bg);transition:.15s;}
.acts button:hover{border-color:#C9C2B3;background:#fff;color:var(--ink);}
.acts button.danger{color:#B4453A;border-color:#E4CEC9;}
.acts button.danger:hover{background:#FCF1EF;}
.dbody{flex:1;overflow:auto;padding:14px 18px 30px;}

<script>
/* =====================================================================
   TimeFlow · 事件生命线系统
   架构（单文件内分区模块，职责分离，无全局隐式依赖）
     0  U        纯工具（日期 / 文案 / 颜色 / 唯一 ID）
     1  CFG      常量配置（视图 / 调色板 / 关系类型）
     2  DB       内存仓库 + 持久化（localStorage，含备份与迁移）
     3  Domain   数据规范、排序、状态判定、日期影响、完整性校验
     4  Journal  变更日志（回放的唯一数据来源）
     5  Hist     撤销 / 重做
     6  Commit   唯一写入口（回放只读拦截 + 日志 + 保存 + 渲染）
     7  Engine   时间几何（行高模型 / 坐标 / 分带聚合）
     8  Render   视图渲染（日期轴 / 生命线 / 关系线 / 轨道 / 抽屉…）
     9  Actions  业务动作
     10 UI       交互绑定（含移动端）
     11 Init     启动
     window.TF     对外测试接口（自动化测试用）
   ===================================================================== */
'use strict';

/* ===================== 0. U：纯工具 ===================== */
const U = (() => {
  const DAY = 86400000;
  const WD = ['周日','周一','周二','周三','周四','周五','周六'];
  const pad = n => String(n).padStart(2,'0');
  const parse = s => { const a = String(s).slice(0,10).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); };
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return fmt(d); };
  const db = (a,b) => Math.round((parse(b) - parse(a)) / DAY);
  const md = s => `${Number(String(s).slice(5,7))}.${String(s).slice(8,10)}`;
  const ymd = s => String(s||'').replace(/-/g,'.');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hexA = (hex,a) => { const h = String(hex||'#8C867B').replace('#',''); const r = parseInt(h.slice(0,2),16)||0, g = parseInt(h.slice(2,4),16)||0, b = parseInt(h.slice(4,6),16)||0; return `rgba(${r},${g},${b},${a})`; };
  const clone = o => JSON.parse(JSON.stringify(o));
  /* 全局唯一 ID：优先 crypto.randomUUID，回退时间戳+随机串；不再使用自增计数 */
  let seq = 0;
  const uid = p => {
    let body;
    try { body = (crypto.randomUUID ? crypto.randomUUID() : '').replace(/-/g,''); } catch(e){ body = ''; }
    if (!body) body = (Date.now().toString(36) + Math.random().toString(36).slice(2,8) + (seq++).toString(36));
    return p + '_' + body.slice(0, 14);
  };
  const isDate = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))) return false; const d = parse(s); return fmt(d) === s; };
  const TS = s => parse(s).getTime();
  const endOfDay = s => parse(s).getTime() + DAY - 1;
  const TODAY = fmt(new Date());
  const nowISO = () => new Date().toISOString();
  return { DAY, WD, pad, parse, fmt, addDays, db, md, ymd, esc, hexA, clone, uid, isDate, TS, endOfDay, TODAY, nowISO };
})();
const { DAY, WD, pad, parse, fmt, addDays, db, md, ymd, esc, hexA, clone, uid, isDate, TS, endOfDay, TODAY, nowISO } = U;

/* ===================== 1. CFG：常量 ===================== */
/* unit：该视图在刻度上聚合到哪一级（日/周/月/年）；坐标仍以天为最小单位，节点精度不变 */
const VIEWS = [
  { k:'day',     n:'日',   base:27,  gap:13, unit:'day',   band:null },

/* 事件自身 + 一跳关系（关联线、父事件、子分支）组成"只看这些"集合 */
function isoSet(id){
  const out = new Set([id]);
  const ev = findEv(id);
  if (!ev) return out;
  if (ev.branch && ev.branch.parent) out.add(ev.branch.parent);
  VIEW_EVENTS.forEach(x => { if (x.branch && x.branch.parent === id) out.add(x.id); });
  VIEW_LINKS.forEach(l => { if (l.a === id) out.add(l.b); if (l.b === id) out.add(l.a); });
  return out;
}

const Persist = (() => {
  const KEY = 'timeline.v3';
  const OLD = ['timeline.v2','timeline.v1'];
  const BAK = 'timeline.backup.v3';
  let key = KEY;                 /* 当前写入键：未登录是本机键，登录后是账号键 */
  const setKey = k => { key = k || KEY; };
  const getKey = () => key;
  const userKey = uid => 'timeline.v3.u.' + uid;
  const pack = () => ({
    schema:'timeflow', version:3, app:'TimeFlow', savedAt: Date.now(),
    events: EVENTS, links: LINKS, trash: TRASH,
    base: BASE ? { at: BASE.at, events: BASE.events, links: BASE.links } : null,
    journal: JOURNAL.slice(-150),
    settings:{ view:state.view, viewKey:VIEWS[state.view].k, laneW:state.laneW, density:state.density, relMode:state.relMode,
      status:state.status, cat:state.cat, hideEnded:state.hideEnded },
  });
  function save(){
    try{
      localStorage.setItem(key, JSON.stringify(pack()));
      state.save = 'ok'; state.lastError = null;
      return true;
    }catch(err){
      state.save = 'fail'; state.lastError = err.message;
      Log.err('保存失败', err);
      UI.toast('保存失败：' + (err.name === 'QuotaExceededError' ? '本地存储空间不足，请导出备份' : err.message));
      return false;
    }
  }
  function backup(){
    try{ localStorage.setItem(BAK, localStorage.getItem(key) || ''); return true; }catch(e){ return false; }
  }
  function restoreBackup(){
    try{
      const raw = localStorage.getItem(BAK); if (!raw) return false;
      const o = JSON.parse(raw); return Import.apply(o, true);
    }catch(e){ return false; }
  }
  function load(){
    let raw = null, src = null;
    try{ raw = localStorage.getItem(key); if (raw) src = key; }catch(e){ return { ok:false }; }
    if (!raw && key === KEY){
      for (const k of OLD){
        try{ const r = localStorage.getItem(k); if (r){ raw = r; src = k; break; } }catch(e){}
      }
    }
    if (!raw) return { ok:false };
    let o;
    try{ o = JSON.parse(raw); }catch(e){ Log.err('本地数据损坏', e); return { ok:false, corrupt:true }; }
    const valid = Import.validate(o, { silent:true });
    if (!valid.ok){ Log.err('本地数据校验失败', { errors: valid.errors }); }
    /* 即使有告警也尽量载入（尽最大可能保住用户数据） */
    Import.apply(o, true);
    return { ok:true, from: src, migrated: src !== KEY, errors: valid.errors || [], warnings: valid.warnings || [] };
  }
  return { KEY, BAK, save, backup, load, restoreBackup, pack, setKey, getKey, userKey };
})();

/* ===================== 3. Domain：数据规范与规则 ===================== */
const Domain = (() => {
  const sortNodes = (a,b) => (a.date < b.date ? -1 : a.date > b.date ? 1 :
    ((a.sequence||0) - (b.sequence||0)) || ((a.createdAt||0) - (b.createdAt||0)) || (a.id < b.id ? -1 : 1));

  function normAtt(a){
    if (!a) return null;
    if (typeof a === 'string') return { id: uid('a'), name: a, url:'', addedAt: Date.now() };
    if (!a.name) return null;
    return { id: a.id || uid('a'), name: String(a.name), url: a.url || '', addedAt: a.addedAt || Date.now() };
  }

  function normNode(n, evStart){
    if (!n || !isDate(n.date)) return null;
    const att = Array.isArray(n.att) ? n.att.map(normAtt).filter(Boolean) : [];
    return {
      id: n.id || uid('n'),
      date: n.date,
      title: n.title || '进展',
      text: n.text || '',
      att,
      sequence: typeof n.sequence === 'number' ? n.sequence : 1,
      createdAt: n.createdAt || Date.now(),
      updatedAt: n.updatedAt || null,
    };
  }

  function normEvent(e){
    if (!e || !isDate(e.start)) return null;
    const end = isDate(e.end) && e.end >= e.start ? e.end : null;
    const att = Array.isArray(e.att) ? e.att.map(normAtt).filter(Boolean) : [];
    const nodes = (Array.isArray(e.nodes) ? e.nodes : []).map(n => normNode(n, e.start)).filter(Boolean);
    const ev = {
      id: e.id || uid('e'),
      title: e.title || '未命名事件',
      color: e.color || PALETTE[0],
      start: e.start,
      startTime: /^\d{2}:\d{2}$/.test(e.startTime || '') ? e.startTime : (e.startTime || '00:00'),
      end,
      branch: (e.branch && e.branch.parent && isDate(e.branch.date)) ? { parent: e.branch.parent, date: e.branch.date } : null,
      pinned: !!e.pinned,
      collapsed: !!e.collapsed,
      category: e.category || '未分类',
      desc: e.desc || '',
      result: e.result || '',
      att,
      nodes,
      createdAt: e.createdAt || TS(e.start),
      updatedAt: e.updatedAt || null,
      deletedAt: e.deletedAt || null,
    };
    return ev;
  }

  /* 状态：未开始 / 进行中 / 已结束（不设暂停态） */
  function statusOf(ev, at){
    const d = at || cutDate();
    if (ev.start > d) return '未开始';
    if (ev.end && ev.end <= d) return '已结束';
    return '进行中';
  }

  /* 排序：开始日期 → 开始时间 → 创建时间 → id（与置顶无关，置顶只做视觉强调） */
  function sortEvents(list){
    return list.slice().sort((a,b) =>
      (a.start < b.start ? -1 : a.start > b.start ? 1 : 0) ||
      ((a.startTime || '00:00') < (b.startTime || '00:00') ? -1 : (a.startTime || '00:00') > (b.startTime || '00:00') ? 1 : 0) ||
      ((a.createdAt || 0) - (b.createdAt || 0)) ||
      (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  }

  /* 修改开始/结束日期的连带影响（先告知、再执行） */
  function dateImpact(ev, next){
    const out = { hard:[], soft:[], nodesOut:[], branches:[], links:[] };
    if (next.start && next.start > ev.start){
      const moved = ev.nodes.filter(n => n.date < next.start);
      if (moved.length) out.nodesOut = moved;
      out.hard.push(`有 ${moved.length} 个进展节点早于新的开始日期`);
    }
    if (next.end && next.end < (ev.end || TODAY)){
      const moved = ev.nodes.filter(n => n.date > next.end);
      if (moved.length) out.nodesOut = moved;
      out.hard.push(`有 ${moved.length} 个进展节点晚于新的结束日期`);
    }
    const children = EVENTS.filter(x => x.branch && x.branch.parent === ev.id);
    children.forEach(c => {
      if ((next.start && c.start < next.start) || (next.end && c.branch.date > next.end))
        out.branches.push(c);
    });
    if (out.branches.length) out.soft.push(`${out.branches.length} 条子分支的来源节点可能失效`);
    LINKS.filter(l => l.a === ev.id || l.b === ev.id).forEach(l => {
      const other = EVENTS.find(x => x.id === (l.a === ev.id ? l.b : l.a));
      if (!other) return;
      const s1 = next.start || ev.start, e1 = next.end || TODAY;
      if ((l.type === 'require' || l.type === 'dep') && (l.a === ev.id ? e1 > other.start : (other.end || TODAY) > s1)) out.links.push(l);
      if ((l.type === 'conflict' || l.type === 'concurrent') && (e1 < other.start || (other.end || TODAY) < s1)) out.links.push(l);
    });
    if (out.links.length) out.soft.push(`${out.links.length} 条关系的时序需要复核`);
    return out;
  }

  /* ID 冲突/缺失修复：保留有效的第一个 ID，冲突时重新生成（引用保持指向第一个，避免错乱） */
  function dedupe(events, links){
    const seen = new Set(), nodeSeen = [];
    const fixed = events.map(e => {
      let id = e.id;
      if (!id || seen.has(id)) id = uid('e');
      seen.add(id);
      e.id = id;
      const ns = new Set();
      e.nodes.forEach(n => {
        let nid = n.id;
        if (!nid || ns.has(nid)) nid = uid('n');
        ns.add(nid); n.id = nid;
      });
      (e.att || []).forEach(a => { if (!a.id || a.id === '') a.id = uid('a'); });
      e.nodes.forEach(n => (n.att || []).forEach(a => { if (!a.id) a.id = uid('a'); }));
      return e;
    });
    return fixed;
  }

  function normLink(l){
    if (!l || !l.a || !l.b) return null;
    return { id: l.id || uid('l'), a: l.a, b: l.b,
      type: REL[l.type] ? l.type : 'ref',
      label: l.label || (REL[l.type] ? REL[l.type].n : '关联'),
      createdAt: l.createdAt || Date.now() };
  }

  /* 关系审计：严重错误 / 潜在问题 / 时间冲突 / 正常 */
  function audit(){
    const rep = { severe:[], warn:[], time:[], ok:[], counts:{ severe:0, warn:0, time:0, ok:0 } };
    const byId = id => EVENTS.find(e => e.id === id);
    const pairKey = (l, t) => [l.a, l.b].sort().join('|') + '|' + (t || l.type);

    LINKS.forEach(l => {
      const A = byId(l.a), B = byId(l.b);
      if (!A || !B){ rep.severe.push({ t:'关系端点缺失', d:`关系 ${l.id} 指向不存在的事件（${!A?l.a:''}${!B?l.b:''}）`, ids:[l.a,l.b] }); return; }
      if (l.a === l.b){ rep.severe.push({ t:'自关联', d:`「${A.title}」与自己建立了关系`, ids:[A.id] }); }
      if (LINKS.filter(x => pairKey(x) === pairKey(l)).length > 1)
        rep.warn.push({ t:'重复关系', d:`「${A.title}」与「${B.title}」之间存在多条同类型关系`, ids:[A.id,B.id] });
    });

    /* 前置条件（含旧 dep）时序 & 循环 */
    const depG = {};
    LINKS.filter(l => l.type === 'require' || l.type === 'dep').forEach(l => { (depG[l.a] = depG[l.a] || []).push(l.b); });
    const findCycle = () => {
      const st = {}, stack = [];
      let cyc = null;
      const dfs = (v) => {
        if (cyc) return;
        st[v] = 1; stack.push(v);
        for (const w of (depG[v] || [])){
          if (st[w] === 1){ cyc = stack.slice(stack.indexOf(w)).concat(w); return; }
          if (!st[w]) dfs(w);
        }
        st[v] = 2; stack.pop();
      };
      Object.keys(depG).forEach(v => { if (!st[v]) dfs(v); });
      return cyc;
    };
    const cyc = findCycle();
    if (cyc) rep.severe.push({ t:'依赖循环', d:'前置条件形成环路：' + cyc.map(id => (byId(id)||{}).title || id).join(' → '), ids: cyc });

    LINKS.forEach(l => {
      const A = byId(l.a), B = byId(l.b);
      if (!A || !B) return;
      const aEnd = A.end || TODAY, bEnd = B.end || TODAY;
      if ((l.type === 'require' || l.type === 'dep') && aEnd > B.start)
        rep.time.push({ t:'前置条件时序冲突', d:`「${A.title}」到 ${md(aEnd)} 才结束，而「${B.title}」在 ${md(B.start)} 已开始`, ids:[A.id,B.id] });
      if ((l.type === 'concurrent') && (aEnd < B.start || bEnd < A.start))
        rep.time.push({ t:'同时进行无重叠', d:`「${A.title}」与「${B.title}」在时间上并不重叠`, ids:[A.id,B.id] });
      if (l.type === 'conflict' && (aEnd < B.start || bEnd < A.start))
        rep.time.push({ t:'相互冲突但无重叠', d:`「${A.title}」与「${B.title}」在时间上并不重叠`, ids:[A.id,B.id] });
      if ((l.type === 'support' || l.type === 'feedback') && B.start < A.start)
        rep.time.push({ t:'支持早于来源', d:`「${B.title}」早于「${A.title}」开始，支持方向可疑`, ids:[A.id,B.id] });
      if ((l.type === 'follow' || l.type === 'cause') && B.start < A.start)
        rep.time.push({ t:'因果方向可疑', d:`「${B.title}」早于「${A.title}」开始`, ids:[A.id,B.id] });
      if (l.type === 'ref' || l.type === 'link') rep.ok.push({ t:'相互参照', d:`「${A.title}」↔「${B.title}」`, ids:[A.id,B.id] });
    });

    /* 分支：父存在 / 日期合法 / 环 */
    EVENTS.filter(e => e.branch).forEach(c => {
      const p = byId(c.branch.parent);
      if (!p){ rep.severe.push({ t:'分支父事件缺失', d:`「${c.title}」的父事件已被删除`, ids:[c.id] }); return; }
      if (c.branch.date < p.start || c.branch.date > (p.end || TODAY))
        rep.time.push({ t:'分支来源日期越界', d:`「${c.title}」的来源节点 ${md(c.branch.date)} 不在父事件时间内`, ids:[p.id,c.id] });
      if (!p.nodes.some(n => n.date === c.branch.date))
        rep.warn.push({ t:'分支来源无节点', d:`父事件「${p.title}」在 ${md(c.branch.date)} 没有进展节点，分支指向空日期`, ids:[p.id,c.id] });
      if (c.start < c.branch.date)
        rep.time.push({ t:'分支开始早于来源', d:`「${c.title}」在 ${md(c.start)} 就开始，早于来源节点 ${md(c.branch.date)}`, ids:[p.id,c.id] });
      let walk = p, depth = 0, bad = false;
      while (walk && walk.branch && depth++ < 20){ if (walk.id === c.id){ bad = true; break; } walk = byId(walk.branch.parent); }
      if (bad) rep.severe.push({ t:'父子循环', d:`「${c.title}」的分支链回到自身`, ids:[c.id] });
    });

    rep.counts.severe = rep.severe.length; rep.counts.warn = rep.warn.length;
    rep.counts.time = rep.time.length; rep.counts.ok = rep.ok.length;
    return rep;
  }

  return { normEvent, normNode, normAtt, normLink, statusOf, sortEvents, sortNodes, dateImpact, dedupe, audit };
})();
const { normEvent, normNode, normAtt, normLink, statusOf, sortEvents, sortNodes, dateImpact, dedupe, audit } = Domain;

/* ===================== 4. Journal：变更日志（回放数据源） ===================== */
const Journal = (() => {
  const MAX = 150;
  function log(rec){
    JOURNAL.push(Object.assign({ at: Date.now() }, rec));
    if (JOURNAL.length > MAX) JOURNAL.splice(0, JOURNAL.length - MAX);
  }
  /* 以 BASE 快照为起点，正向应用日志里的 after 镜像，精确重建任意时刻状态 */
  function stateAt(ts){
    const b = BASE || { at: Date.now(), events: EVENTS, links: LINKS };
    const evs = clone(b.events), lnk = clone(b.links || []);
    let applied = 0;
    for (let i = 0; i < JOURNAL.length; i++){
      const r = JOURNAL[i];
      if (r.at > ts) break;
      applied++;
      if (r.kind === 'ev'){
        const idx = evs.findIndex(e => e.id === r.id);
        if (!r.after){ if (idx >= 0) evs.splice(idx, 1); }
        else if (idx >= 0) evs[idx] = clone(r.after);
        else evs.push(clone(r.after));
      } else if (r.kind === 'lk'){
        lnk.splice(0, lnk.length, ...clone(r.after || []));
      }
    }
    const sorted = sortEvents(evs);
    return { events: sorted, links: lnk, early: ts < (b.at || 0), applied };
  }
  function setBase(){
    BASE = { at: Date.now(), events: clone(EVENTS), links: clone(LINKS) };
    return BASE;
  }
  return { log, stateAt, setBase, MAX, base: () => BASE };
})();

/* ===================== 5. Hist：撤销 / 重做 ===================== */
const Hist = (() => {
  let undoStack = [], redoStack = [];
  const snapshot = () => ({ events: clone(EVENTS), links: clone(LINKS), trash: clone(TRASH), jlen: JOURNAL.length, sel: state.selected });
  function push(){
    undoStack.push(snapshot());
    if (undoStack.length > 30) undoStack.shift();
    redoStack = [];
  }
  function apply(snap){
    EVENTS = clone(snap.events); LINKS = clone(snap.links); TRASH = clone(snap.trash);
    if (JOURNAL.length > snap.jlen) JOURNAL.length = snap.jlen;
    state.selected = snap.sel; state.focusNode = null;
  }
  function undo(){
    if (isReadOnly()){ UI.toast('回放模式只读'); return; }
    if (!undoStack.length){ UI.toast('没有可撤销的操作'); return; }
    const cur = snapshot();
    const prev = undoStack.pop();
    redoStack.push(cur);
    apply(prev);
    Persist.save(); Render.all(); UI.toast('已撤销');
  }
  function redo(){
    if (isReadOnly()){ UI.toast('回放模式只读'); return; }
    if (!redoStack.length){ UI.toast('没有可重做的操作'); return; }
    undoStack.push(snapshot());
    apply(redoStack.pop());
    Persist.save(); Render.all(); UI.toast('已重做');
  }
  return { push, undo, redo, get canUndo(){ return undoStack.length; }, get canRedo(){ return redoStack.length; } };
})();

/* ===================== 6. Commit：唯一写入口 ===================== */
function cutDate(){ return state.replay || TODAY; }
const findEv = id => VIEW_EVENTS.find(e => e.id === id) || null;   /* 读（可能是历史快照） */
const findLive = id => EVENTS.find(e => e.id === id) || null;      /* 写（永远是真实数据） */

function logDiff(beforeEv, beforeLk){
  const at = Date.now();
  const bmap = new Map(beforeEv.map(e => [e.id, e]));
  const ids = new Set([].concat(beforeEv.map(e => e.id), EVENTS.map(e => e.id)));
  ids.forEach(id => {
    const b = bmap.get(id), a = EVENTS.find(e => e.id === id);
    if (!b && a) Journal.log({ at, kind:'ev', id, before:null, after:clone(a) });
    else if (b && !a) Journal.log({ at, kind:'ev', id, before:clone(b), after:null });
    else if (b && a && JSON.stringify(b) !== JSON.stringify(a)) Journal.log({ at, kind:'ev', id, before:clone(b), after:clone(a) });
  });
  if (JSON.stringify(beforeLk) !== JSON.stringify(LINKS)) Journal.log({ at, kind:'lk', before:beforeLk, after:clone(LINKS) });
}

/* 所有写操作必须经过 commit：回放只读在这里做「底层拦截」，隐藏按钮只是辅助 */
function commit(fn, opt = {}){
  if (isReadOnly()){ UI.toast('历史回放为只读模式，请先退出回放'); return false; }
  Hist.push();
  const beforeEv = clone(EVENTS), beforeLk = clone(LINKS);
  try{
    fn();
  }catch(err){
    EVENTS = beforeEv; LINKS = beforeLk;   /* 原子回滚 */
    Log.err('操作失败', err);
    UI.toast('操作失败：' + err.message);
    return false;
  }
  logDiff(beforeEv, beforeLk);
  Persist.save();
  if (!opt.silent) Render.all();
  return true;
}

/* ===================== 7. Import / Export：校验与原子导入 ===================== */
const Import = (() => {
  function validate(o, opt = {}){
    const errors = [], warnings = [];
    if (!o || typeof o !== 'object'){ errors.push('文件不是有效的 JSON 对象'); return { ok:false, errors, warnings }; }
    const events = Array.isArray(o) ? o : o.events;
    if (!Array.isArray(events)){ errors.push('缺少 events 数组'); return { ok:false, errors, warnings }; }
    const version = o.version || (Array.isArray(o) ? 1 : 0);
    if (version < 3) warnings.push(`数据版本为 v${version || '未知'}，将按当前结构迁移`);
    if (o.schema && o.schema !== 'timeflow') warnings.push('数据来源 schema 不是 timeflow');
    const ids = new Set();
    let badDates = 0, noStart = 0, dupIds = 0;
    events.forEach((e, i) => {
      if (!e || !isDate(e.start)){ noStart++; return; }
      if (e.end && !isDate(e.end)) badDates++;
      if (e.end && e.end < e.start) warnings.push(`「${e.title || i}」结束日期早于开始日期，将忽略结束日期`);
      if (e.id){ if (ids.has(e.id)) dupIds++; ids.add(e.id); }
    });
    if (noStart) errors.push(`${noStart} 个事件缺少合法的开始日期`);
    if (dupIds) warnings.push(`${dupIds} 个事件的 ID 重复，导入时会自动重新分配（引用仍指向同名第一个事件）`);
    if (badDates) warnings.push(`${badDates} 个事件的结束日期格式非法，将被忽略`);
    const links = (o.links || []);
    if (!Array.isArray(links)){ errors.push('links 不是数组'); }
    else {
      const evIds = new Set(events.filter(e => e && isDate(e.start)).map(e => e.id));
      let dangling = 0;
      links.forEach(l => {
        if (!l || !l.a || !l.b) errors.push('存在缺少端点的事件关系');
        else if (!evIds.has(l.a) || !evIds.has(l.b)) dangling++;
      });
      if (dangling) warnings.push(`${dangling} 条关系指向不存在的事件，导入时会被忽略`);
      const lid = new Set(); let dupL = 0;
      links.forEach(l => { if (l && l.id){ if (lid.has(l.id)) dupL++; lid.add(l.id); } });
      if (dupL) warnings.push(`${dupL} 条关系 ID 重复，将重新分配`);
    }
    if (events.length > 2000) warnings.push('事件数量较多（' + events.length + '），渲染可能变慢');
    const ok = errors.length === 0;
    if (!opt.silent && ok) warnings.forEach(w => Log.err('导入告警', w));
    return { ok, errors, warnings, version, events, links };
  }

  /* 原子替换：先完整解析/校验/规范化到临时变量，全部成功后才写入 */
  function apply(o, internal){
    const v = validate(o, { silent:true });
    if (!v.ok) return false;
    const evs = (v.events || []).filter(e => e && isDate(e.start)).map(normEvent).filter(Boolean);
    let lks = (v.links || []).map(normLink).filter(Boolean);
    dedupe(evs, lks);
    /* 关系 ID 去重 + 丢弃指向不存在事件的关系 */
    const lid = new Set();
    lks.forEach(l => { if (!l.id || lid.has(l.id)) l.id = uid('l'); lid.add(l.id); });
    lks = lks.filter(l => evs.some(e => e.id === l.a) && evs.some(e => e.id === l.b));
    if (!internal) Hist.push();
    EVENTS = sortEvents(evs);
    LINKS = lks;
    TRASH = Array.isArray(o.trash) ? o.trash.filter(x => x && x.ev).map(x => ({ ev: normEvent(x.ev), at: x.at || Date.now() })).filter(x => x.ev) : [];
    JOURNAL = Array.isArray(o.journal) ? o.journal.slice(-150) : [];
    /* 日志起点：优先用数据自带快照，否则以本次载入状态为起点（此后所有改动都可回放） */
    BASE = (o.base && Array.isArray(o.base.events))
      ? { at: o.base.at || Date.now(), events: o.base.events.map(normEvent).filter(Boolean), links: Array.isArray(o.base.links) ? o.base.links : [] }
      : { at: Date.now(), events: clone(EVENTS), links: clone(LINKS) };
    const s = o.settings || {};
    /* 旧数据可能带已移除的「季」档：优先按 key 还原，找不到再按序号夹取 */
    if (typeof s.viewKey === 'string'){
      const ki = VIEWS.findIndex(v => v.k === s.viewKey);
      if (ki >= 0) state.view = ki;
      else if (typeof s.view === 'number') state.view = Math.min(VIEWS.length-1, Math.max(0, s.view));
    } else if (typeof s.view === 'number') state.view = Math.min(VIEWS.length-1, Math.max(0, s.view));
    if (typeof s.laneW === 'number') state.laneW = Math.min(2, Math.max(0, s.laneW));
    if (s.density) state.density = s.density;
    if (s.relMode) state.relMode = s.relMode;
    if (s.status) state.status = s.status;
    if (s.cat) state.cat = s.cat;
    if (typeof s.hideEnded === 'boolean') state.hideEnded = s.hideEnded;
    state.replay = null; state.selected = null; state.focusNode = null;
    refreshView();
    return true;
  }

  function fromText(text){
    let o;
    try{ o = JSON.parse(text); } catch(e){ return { ok:false, errors:['JSON 解析失败：' + e.message], warnings:[] }; }
    const v = validate(o);
    if (!v.ok) return v;
    return v;
  }
  return { validate, apply, fromText };
})();

function exportData(){
  const data = Persist.pack();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `timeflow-${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1200);
  UI.toast(`已导出 ${EVENTS.length} 个事件 / ${LINKS.length} 条关系`);
  return data;
}

/* 视图数据源切换 */
function refreshView(){
  if (state.replay){
    const snap = Journal.stateAt(endOfDay(state.replay));
    VIEW_EVENTS = snap.events; VIEW_LINKS = snap.links;
    state.replayEarly = !!snap.early;
  } else {
    VIEW_EVENTS = EVENTS; VIEW_LINKS = LINKS;
    state.replayEarly = false;
  }
  if (state.selected && !VIEW_EVENTS.some(e => e.id === state.selected)) { state.selected = null; state.focusNode = null; }
}

/* ===================== 8. Engine：时间几何 ===================== */
const Engine = (() => {
  let MIN_D = TODAY, MAX_D = TODAY, TOTAL = 0, ROWS = [], YMAP = {}, CANVAS_H = 0, TOTAL_W = 0, LANES = [];
  let dayBase = VIEWS[0].base, stackGap = VIEWS[0].gap;

  const cut = () => cutDate();

  function yOf(d){
    if (YMAP[d] !== undefined) return YMAP[d];
    if (d < MIN_D) return PAD_TOP;
    return CANVAS_H - 88;
  }
  const PAD_TOP = 26;

  function endDisp(ev){
    const c = cut();
    if (ev.end && ev.end <= c) return ev.end;
    if (ev.start > c) return ev.start;
    return c;
  }

  /* 当前视图的分带（周 / 月 / 年聚合刻度） */
  function bandKey(d, unit){
    const dt = parse(d);
    if (unit === 'week'){ const t = new Date(dt); const dow = (dt.getDay() + 6) % 7; t.setDate(t.getDate() - dow); return fmt(t); }
    if (unit === 'month') return d.slice(0,7);
    if (unit === 'year') return d.slice(0,4);
    return d;
  }

  function buildLayout(){
    const c = cut();
    const dates = [c, TODAY];
    VIEW_EVENTS.forEach(ev => {
      dates.push(ev.start);
      if (ev.end) dates.push(ev.end);
      (ev.nodes || []).forEach(n => dates.push(n.date));
      if (ev.branch && ev.branch.date) dates.push(ev.branch.date);
    });
    const sorted = dates.filter(Boolean).sort();
    MIN_D = addDays(sorted[0] || TODAY, -4);
    const latest = sorted[sorted.length-1] > c ? sorted[sorted.length-1] : c;
    MAX_D = addDays(latest, 5);
    TOTAL = Math.max(12, db(MIN_D, MAX_D));
    const stageH = Math.max(400, window.innerHeight - 210);
    const needDays = db(MIN_D, TODAY) + Math.ceil(stageH / dayBase) + 6;
    if (TOTAL < needDays){ TOTAL = needDays; MAX_D = addDays(MIN_D, TOTAL); }

    const counts = {};
    VIEW_EVENTS.forEach(ev => {
      const c2 = {};
      ev.nodes.forEach(n => {
        if (n.date < ev.start) return;
        if (ev.end && n.date > ev.end) return;
        if (n.date > c) return;
        c2[n.date] = (c2[n.date] || 0) + 1;
      });
      Object.keys(c2).forEach(d => { counts[d] = Math.max(counts[d] || 1, c2[d]); });
    });

    ROWS = []; YMAP = {}; let top = PAD_TOP;
    for (let i = 0; i <= TOTAL; i++){
      const d = addDays(MIN_D, i);
      const h = dayBase + Math.max(0, (counts[d] || 1) - 1) * stackGap;
      ROWS.push({ date:d, top, h, band: bandKey(d, VIEWS[state.view].unit), first: false });
      YMAP[d] = top;
      top += h;
    }
    /* 标记每个分带的第一天，用于聚合刻度 */
    let prevBand = null;
    ROWS.forEach(r => { if (r.band !== prevBand){ r.first = true; prevBand = r.band; } });
    CANVAS_H = top + 88;
  }

  function dateAtY(y){
    let lo = 0, hi = ROWS.length - 1;
    while (lo <= hi){
      const mid = (lo + hi) >> 1, r = ROWS[mid];
      if (y < r.top) hi = mid - 1;
      else if (y >= r.top + r.h) lo = mid + 1;
      else return r.date;
    }
    return y < PAD_TOP ? MIN_D : MAX_D;
  }

  /* 轨道列表：严格按 开始日期→开始时间→创建时间；置顶不改变顺序 */
  function laneEvents(){
    if (state.isolate && !findEv(state.isolate)) state.isolate = null;  /* 被删事件自动解除 */
    let list = VIEW_EVENTS.slice();
    if (state.hideEnded) list = list.filter(e => statusOf(e) !== '已结束');
    if (state.status !== 'all'){
      const map = { active:'进行中', ended:'已结束' };
      list = list.filter(e => statusOf(e) === map[state.status]);
    }
    if (state.cat !== 'all') list = list.filter(e => (e.category || '未分类') === state.cat);
    if (state.isolate) { const iso = isoSet(state.isolate); list = list.filter(e => iso.has(e.id)); }
    return sortEvents(list);
  }

  function computeLanes(){
    const G = GUTTER();
    const vis = laneEvents();
    let x = G;
    LANES = vis.map((ev, i) => {
      const w = ev.collapsed ? COLLAPSED_W : LANE_W[state.laneW];
      const rec = { ev, idx:i, x, w, cx: x + (ev.collapsed ? w/2 : 30) };
      x += w;
      return rec;
    });
    TOTAL_W = x;
    const canvas = document.getElementById('canvas');
    canvas.style.width = (x + 140) + 'px';
    canvas.style.height = CANVAS_H + 'px';
    return LANES;
  }

  const laneOf = id => LANES.find(l => l.ev.id === id);

  function nodeY(ev, n){
    const base = YMAP[n.date];
    if (base === undefined) return null;
    const c = cut();
    const same = ev.nodes
      .filter(x => x.date === n.date && x.date >= ev.start && (!ev.end || x.date <= ev.end) && x.date <= c)
      .sort(sortNodes);
    const k = same.findIndex(x => x.id === n.id);
    return base + dayBase * 0.52 + Math.max(0, k) * stackGap;
  }

  function segList(ev, endD){ return [{ from:ev.start, to:endD }]; }

  function setView(i){
    state.view = Math.min(VIEWS.length-1, Math.max(0, i));
    dayBase = VIEWS[state.view].base;
    stackGap = VIEWS[state.view].gap;
  }

  return {
    buildLayout, dateAtY, computeLanes, laneOf, nodeY, segList, endDisp, yOf, laneEvents, setView,
    get ROWS(){ return ROWS; }, get YMAP(){ return YMAP; }, get CANVAS_H(){ return CANVAS_H; },
    get TOTAL_W(){ return TOTAL_W; }, get LANES(){ return LANES; },
    get MIN_D(){ return MIN_D; }, get MAX_D(){ return MAX_D; },
    get dayBase(){ return dayBase; }, get stackGap(){ return stackGap; },
  };
})();
const yOf = Engine.yOf, dateAtY = Engine.dateAtY, nodeY = Engine.nodeY, segList = Engine.segList,
      endDisp = Engine.endDisp, laneOf = Engine.laneOf;

/* ===================== 9. Render：视图 ===================== */
const Render = (() => {

  function all(){
    refreshView();
    Engine.buildLayout();
    Engine.computeLanes();
    grid();
    lanes();
    links();
    header();
    stats();
    views();
    drawer();
    pill();
    if (document.getElementById('panel').classList.contains('open')) panel();
    saveBadge();
  }

  /* ---- 日期轴 ---- */
  function grid(){
    const dayBase = Engine.dayBase, ROWS = Engine.ROWS;
    const showDay = dayBase >= 19;
    const showWeek = dayBase >= 8;
    const band = VIEWS[state.view].band;
    let lines = '', tags = '', cells = '';

    ROWS.forEach(r => {
      const dt = parse(r.date);
      if (dt.getDay() === 1 && showWeek) lines += `<div class="week-line" style="top:${r.top}px"></div>`;

      if (dt.getDate() === 1){
        lines += `<div class="month-line" style="top:${r.top}px"></div>`;
        tags += `<div class="month-tag" style="top:${r.top + Math.max(1, (r.h - 15) / 2)}px">${dt.getMonth()+1}<em>月</em></div>`;
        if (dt.getMonth() === 0) tags += `<div class="year-tag" style="top:${r.top - 15}px">${dt.getFullYear()} 年</div>`;
        if (!showWeek && [0,3,6,9].includes(dt.getMonth()) && dt.getMonth() !== 0)
          lines += `<div class="q-line" style="top:${r.top}px"></div>`;
      }

      /* 聚合刻度：季度按周、年按月、长期按年，加粗分带线 + 分带标签 */
      if (band && r.first && !(band === 'month' && dt.getDate() === 1) && !(band === 'year' && dt.getMonth() === 0)){
        lines += `<div class="band-line" style="top:${r.top}px"></div>`;
        if (band === 'week' && dt.getDate() !== 1)
          tags += `<div class="band-tag" style="top:${r.top + Math.max(0,(r.h-11)/2)}px">${md(r.date)}</div>`;
        if (band === 'month' && dt.getDate() !== 1)
          tags += `<div class="band-tag" style="top:${r.top + Math.max(0,(r.h-11)/2)}px">${dt.getMonth()+1}<em>月</em></div>`;
        if (band === 'year' && dt.getMonth() !== 0)
          tags += `<div class="band-tag" style="top:${r.top + Math.max(0,(r.h-11)/2)}px">${dt.getFullYear()}</div>`;
      }

      if (r.date === TODAY && !state.replay){
        lines += `<div class="today-glow" style="top:${r.top - 4}px"></div>`;
        lines += `<div class="today-line" style="top:${r.top + r.h/2}px"></div>`;
        tags += `<div class="today-badge" style="top:${r.top + r.h/2 - 9}px">今天</div>`;
      }

      if (state.replay && r.date === state.replay){
        lines += `<div class="replay-line" style="top:${r.top + r.h/2}px"></div>`;
        tags += `<div class="today-badge" style="left:4px;top:${r.top + r.h/2 - 9}px;background:#6F62A8">回放</div>`;
      }

      if (showDay){
        const wk = (dt.getDay() === 0 || dt.getDay() === 6);
        cells += `<div class="day-cell ${wk?'is-weekend':''} ${r.date===TODAY&&!state.replay?'is-today':''}" data-date="${r.date}" style="top:${r.top}px;height:${r.h}px">
          <span class="day-num">${dt.getDate()}</span><span class="day-wd">${WD[dt.getDay()]}</span></div>`;
      } else {
        const tick = dayBase >= 8 && dt.getDay() === 1;
        if (tick || (dayBase < 8 && dt.getDate() === 1)) cells += `<div class="day-cell" data-date="${r.date}" style="top:${r.top}px;height:${r.h};justify-content:flex-end;padding-right:13px">
          <span style="font-size:10px;color:#9C968A;font-variant-numeric:tabular-nums">${dt.getDate()}</span></div>`;
      }
    });

    document.getElementById('grid').innerHTML = lines;
    const gutter = document.getElementById('gutter');
    document.documentElement.style.setProperty('--gutter', GUTTER() + 'px');
    gutter.style.width = GUTTER() + 'px';
    gutter.style.height = Engine.CANVAS_H + 'px';
    gutter.innerHTML = `<div class="spine"></div><div class="spine-label">主时间轴</div>${tags}${cells}`;
    if (window.tfClearRowHi) window.tfClearRowHi();
  }

  /* ---- 生命线 ---- */
  function lanes(){
    const wrap = document.getElementById('lanes');
    const q = (state.q || '').trim().toLowerCase();
    const showLabels = Engine.dayBase >= 19;
    const LANES = Engine.LANES;

    if (!LANES.length){
      wrap.innerHTML = `<div class="empty-state" style="position:absolute;left:130px;top:40px;right:60px;padding:22px 24px;border:1px dashed #D8D1C2;border-radius:13px;background:rgba(251,250,246,.7);color:#8C867B;font-size:12px;line-height:1.9">
        <b style="color:#4B473F">这里还没有事件</b><br>点击左侧日期栏任意一天，创建第一条事件生命线；也可以在右上角通过「⋯ → 恢复示例数据」载入一组示例。</div>`;
      return;
    }

    let html = '';
    LANES.forEach(l => {
      const ev = l.ev, c = ev.color;
      const startY = yOf(ev.start);
      const endD = endDisp(ev);
      const endY = Math.max(yOf(endD), startY);
      const st = statusOf(ev);
      const ended = !!ev.end && ev.end <= cutDate();
      const notStarted = ev.start > cutDate();
      const days = db(ev.start, endD) + 1;
      const hasEndNode = ev.nodes.some(n => n.date === ev.end);
      const hasStartNode = ev.nodes.some(n => n.date === ev.start);
      const hitEv = !q || ev.title.toLowerCase().includes(q) ||
        ev.nodes.some(n => (n.title + ' ' + (n.text||'')).toLowerCase().includes(q));
      const dim = (q && !hitEv) ? 'dim' : '';

      const PL_MK = `<svg viewBox="0 0 18 18"><path d="M6.6 5.2 L12 9 L6.6 12.8 Z" fill="#fff"/></svg>`;
      const SQ_MK = `<svg viewBox="0 0 18 18"><rect x="5.9" y="5.9" width="6.2" height="6.2" rx="0.8" fill="#fff"/></svg>`;
      const AR_MK = `<svg viewBox="0 0 18 18"><path d="M9 4.2 V12.6 M5.4 9.4 L9 13 L12.6 9.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;

      if (ev.collapsed){
        /* 折叠后仍需保留：开始 / 结束 / 进行中 三种标记 + 各天节点小点 */
        const cx = l.w / 2;
        const cnodes = ev.nodes
          .filter(n => n.date >= ev.start && n.date <= endD)
          .sort(sortNodes)
          .map(n => {
            const ny = nodeY(ev, n);
            if (ny == null || n.date === ev.start || (ended && n.date === ev.end)) return '';
            return `<div class="node ${state.focusNode===n.id?'focus':''}" data-ev="${ev.id}" data-node="${n.id}" style="top:${ny}px;left:${cx}px" title="${esc(n.title)} · ${ymd(n.date)}"><i></i></div>`;
          }).join('');
        const cmark = ended
          ? `<div class="mk mk-end" data-ev="${ev.id}" data-end="1" style="top:${endY}px;left:${cx}px" title="事件正式结束 ${ymd(ev.end)}">${SQ_MK}</div>`
          : (notStarted ? '' : `<div class="mk mk-live" style="top:${endY}px;left:${cx}px" title="进行中 · 生命线延伸至今天">${AR_MK}</div>`);
        html += `<div class="lane collapsed ${state.selected===ev.id?'sel':''}" data-id="${ev.id}" data-open="${ev.id}"
            style="left:${l.x}px;width:${l.w}px;--c:${c};--c15:${hexA(c,.14)};--c30:${hexA(c,.32)}">
          <div class="ribbon" style="left:${l.w/2-1.5}px;width:3px;top:${startY}px;height:${Math.max(endY-startY,2)}px"></div>
          <div class="mk mk-start" style="top:${startY}px;left:${cx}px" title="事件正式开始 ${ymd(ev.start)}">${PL_MK}</div>
          ${cmark}
          <div class="collapse-count" style="top:${Math.max(2,startY-20)}px">${ev.nodes.length}</div>
          ${cnodes}
        </div>`;
        return;
      }

      let ribbons = '';
      segList(ev, endD).forEach(s => {
        const y1 = yOf(s.from), y2 = yOf(s.to);
        ribbons += `<div class="ribbon ${ended?'ended':''}" style="left:28px;width:4px;top:${Math.min(y1,y2)}px;height:${Math.max(Math.abs(y2-y1),2)}px"></div>`;
      });

      let nodes = '';
      ev.nodes
        .filter(n => n.date >= ev.start && n.date <= endD)
        .sort(sortNodes)
        .forEach(n => {
          const ny = nodeY(ev, n);
          if (ny == null) return;
          const focus = state.focusNode === n.id ? 'focus' : '';
          const hit = (q && (n.title+' '+(n.text||'')).toLowerCase().includes(q)) ? 'hit' : '';
          const attN = (n.att || []).length;
          const isEndNode = ended && n.date === ev.end;
          let label = '';
          if (showLabels){
            if (state.density === 'detail'){
              label = `<div class="node-label detail ${focus} ${hit}" data-ev="${ev.id}" data-node="${n.id}" style="top:${ny-8}px;left:44px;width:${l.w-52}px" title="${esc(n.title)}｜${esc(n.text)}">
                <span class="nd">${isEndNode ? '结束 ' : ''}${md(n.date)}</span><span class="nt">${esc(n.title)}</span>
                ${n.text ? `<span class="nx">${esc(n.text)}</span>` : ''}</div>`;
            } else {
              label = `<div class="node-label ${focus} ${hit}" data-ev="${ev.id}" data-node="${n.id}" style="top:${ny-9}px;left:44px;width:${l.w-52}px" title="${esc(n.title)}｜${esc(n.text)}">
                <span class="nd">${isEndNode ? '结束 ' : ''}${md(n.date)}</span><span class="nt">${esc(n.title)}</span>
                ${(state.density === 'attach' && attN) ? `<span class="nx">📎${attN}</span>` : ''}</div>`;
            }
          }
          /* 与开始/结束标记同一天时不重复画小圆点，避免遮住绿▶/红■ */
          const overlapEndpoint = (ended && n.date === ev.end) || n.date === ev.start;
          nodes += `${overlapEndpoint ? '' : `<div class="node ${state.focusNode===n.id?'focus':''}" data-ev="${ev.id}" data-node="${n.id}" style="top:${ny}px;left:30px" title="拖动可调整日期"><i></i></div>`}${label}`;
        });

      const endY2 = endY;
      const marker = (ended
        ? `<div class="mk mk-end" data-ev="${ev.id}" data-end="1" style="top:${endY2}px;left:30px" title="事件正式结束 ${ymd(ev.end)}">${SQ_MK}</div>${!hasEndNode ? `<div class="end-cap" data-ev="${ev.id}" style="top:${endY2 - 7}px;left:44px;cursor:pointer" title="点击查看最终结果"><b>结束 ${ymd(ev.end)}</b></div>` : ''}`
        : (notStarted ? '' : `<div class="mk mk-live" style="top:${endY2}px;left:30px" title="进行中 · 生命线延伸至今天">${AR_MK}</div>`));

      const compact = Engine.dayBase < 20;
      const chipH = compact ? 30 : 56;
      const chipTop = Math.max(4, startY - chipH - 12);
      html += `<div class="lane ${state.selected===ev.id?'sel':''} ${dim} ${ended?'is-ended':''}" data-id="${ev.id}"
          style="left:${l.x}px;width:${l.w}px;--c:${c};--c15:${hexA(c,.14)};--c30:${hexA(c,.32)}">
        <div class="dur-band" style="left:26px;width:8px;top:${startY}px;height:${Math.max(endY2-startY,2)}px"></div>
        ${ribbons}
        <div class="hit" data-ev="${ev.id}" style="top:${startY}px;left:24px;width:26px;height:${Math.max(endY2-startY,2)}px"></div>
        <div class="mk mk-start" style="top:${startY}px;left:30px" title="事件正式开始 ${ymd(ev.start)}">${PL_MK}</div>
        ${marker}
        <div class="chip ${compact?'compact':''} ${ev.pinned?'pinned':''}" data-ev="${ev.id}" style="top:${chipTop}px;left:8px;width:${l.w-16}px">
          ${ev.pinned ? '<span class="pin-mark">★</span>' : ''}
          <div class="chip-main">
            <span class="chip-dot"></span>
            <span class="chip-title">${esc(ev.title)}</span>
          </div>
          ${compact ? '' : `<div class="chip-sub">
            <span>${ymd(ev.start)} 起</span><span>·</span>
            <span class="chip-tag ${st==='进行中'?'live':(st==='已结束'?'ended':'')}">${st}</span>
            <span>·</span><span>${days} 天</span>
          </div>`}
        </div>
        ${nodes}
      </div>`;
    });

    wrap.innerHTML = html;
  }

  /* ---- 关系线 ---- */
  function relVisible(lk){
    if (state.relMode === 'none') return false;
    if (state.relMode === 'current' && state.selected && lk.a !== state.selected && lk.b !== state.selected) return false;
    const c = cutDate();
    const A = findEv(lk.a), B = findEv(lk.b);
    if (!A || !B) return false;
    if (A.start > c || B.start > c) return false;
    return true;
  }

  function links(){
    const svg = document.getElementById('links');
    const canvas = document.getElementById('canvas');
    svg.setAttribute('width', Engine.TOTAL_W + 140);
    svg.setAttribute('height', Engine.CANVAS_H);
    svg.style.width = (Engine.TOTAL_W + 140) + 'px';
    svg.style.height = Engine.CANVAS_H + 'px';

    let defs = '';
    const markerId = {};
    Object.keys(REL).forEach(k => {
      const c = REL[k].c === 'auto' ? '#8C867B' : REL[k].c;
      markerId[k] = 'arw-' + k;
      defs += `<marker id="${markerId[k]}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="${c}" opacity=".85"></path></marker>`;
    });

    let paths = '', labelHTML = '';
    const placed = [];
    const quadAt = (p0, cc, p1, t) => { const u = 1-t; return { x: u*u*p0.x + 2*u*t*cc.x + t*t*p1.x, y: u*u*p0.y + 2*u*t*cc.y + t*t*p1.y }; };
    const cubicAt = (p0, c1, c2, p1, t) => { const u = 1-t;
      return { x: u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x,
               y: u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y }; };
    const placeLabel = (text, color, pt) => {
      const w = Math.min(186, String(text).length * 7.2 + 16);
      for (const p of placed){
        if (Math.abs(p.x - pt.x) < (p.w + w) / 2 + 5 && Math.abs(p.y - pt.y) < 14) return false;
      }
      placed.push({ x:pt.x, y:pt.y, w });
      labelHTML += `<div class="link-label" style="left:${pt.x}px;top:${pt.y}px;color:${color};border-color:${hexA(color,.32)}">${esc(text)}</div>`;
      return true;
    };

    const item = (lk) => {
      const A = findEv(lk.a), B = findEv(lk.b);
      if (!A || !B) return;
      const la = laneOf(A.id), lb = laneOf(B.id);
      if (!la || !lb) return;
      const style = REL[lk.type] || REL.link;
      const color = style.c === 'auto' ? (A.color || '#8C867B') : style.c;
      let x1 = la.x + (A.collapsed ? la.w/2 : 30);
      let x2 = lb.x + (B.collapsed ? lb.w/2 : 30), y1, y2;
      const compact = Engine.dayBase < 20;

      if (lk.type === 'branch' && A.nodes.length){
        const srcDate = lk.date || (A.branch && A.branch.date);
        const n = A.nodes.find(n => n.date === srcDate) || A.nodes[0];
        y1 = nodeY(A, n) || yOf(srcDate || A.start);
        const chipTop = Math.max(4, yOf(B.start) - (compact ? 30 : 56) - 5);
        y2 = chipTop + (compact ? 30 : 24);
      } else {
        const overlapFrom = [A.start, B.start].sort().pop();
        const overlapTo = [endDisp(A), endDisp(B)].sort()[0];
        let d = overlapFrom;
        if (overlapFrom <= overlapTo) d = addDays(overlapFrom, Math.floor(db(overlapFrom, overlapTo) / 2));
        y1 = y2 = yOf(d) + Engine.dayBase * 0.4;
      }

      const midY = (y1 + y2) / 2;
      const p0 = { x:x1, y:y1 }, p1 = { x:x2, y:y2 };
      let d, c1, c2;
      if (lk.type === 'branch'){
        c1 = { x:x1, y:midY }; c2 = { x:x2, y:midY };
        d = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
      } else {
        const lift = Math.min(38, 12 + Math.abs(x2 - x1) / 14);
        c1 = { x:(x1 + x2) / 2, y:Math.min(y1, y2) - lift }; c2 = c1;
        d = `M${x1},${y1} Q${c1.x},${c1.y} ${x2},${y2}`;
      }
      const lw = lk.type === 'branch' ? 1.3 : (style.arrow ? 1.35 : 1.05);
      const op = (state.selected && state.relMode === 'current') ? .95 : (lk.type === 'branch' ? .75 : .62);
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="${lw}" stroke-dasharray="${style.dash}"
        opacity="${op}" marker-end="${style.arrow ? 'url(#' + markerId[lk.type] + ')' : 'none'}"></path>`;
      paths += `<path class="relhit" data-rel="${lk.id}" d="${d}" fill="none" stroke="transparent" stroke-width="13"></path>`;

      if (Engine.dayBase >= 8){
        const tries = lk.type === 'branch' ? [0.55, 0.75, 0.35] : [0.45, 0.62, 0.28, 0.78];
        for (const t of tries){
          const pt = lk.type === 'branch' ? cubicAt(p0, c1, c2, p1, t) : quadAt(p0, c1, p1, t);
          if (placeLabel(lk.label, color, pt)) break;
        }
      }
    };

    VIEW_LINKS.forEach(lk => { if (relVisible(lk)) item(lk); });
    VIEW_EVENTS.filter(ev => ev.branch).forEach(ev => {
      if (!relVisible({ a:ev.branch.parent, b:ev.id })) return;
      item({ a:ev.branch.parent, b:ev.id, type:'branch', label:'分支 · ' + md(ev.branch.date), date:ev.branch.date, id:'br-' + ev.id });
    });

    svg.innerHTML = `<defs>${defs}</defs>${paths}`;

    let lay = document.getElementById('labels');
    if (!lay){ lay = document.createElement('div'); lay.id = 'labels'; lay.style.cssText = 'position:absolute;inset:0;z-index:2;pointer-events:none'; canvas.appendChild(lay); }
    lay.innerHTML = labelHTML;
  }

  /* 左上角年份：取当前视口顶部那天所属年份；滚到某年时高亮显示 */
  function syncYear(){
    const el = document.getElementById('yearNow');
    if (!el) return;
    const stage = document.getElementById('stage');
    const topDate = dateAtY(stage.scrollTop + 10);
    const y = String((topDate || TODAY).slice(0, 4));

    el.classList.toggle('is-now', y === TODAY.slice(0, 4));
    el.title = y === TODAY.slice(0, 4)
      ? '当前视口为今年（' + y + '），与今天同年'
      : '当前视口位于 ' + y + ' 年（今天在 ' + TODAY.slice(0,4) + ' 年）';

  function saveBadge(){
    const el = document.getElementById('saveBadge');
    if (!el) return;
    if (state.save === 'fail'){
      el.className = 'save-badge fail';
      el.textContent = '保存失败';
      el.title = state.lastError ? state.lastError.msg : '';
      return;
    }
    if (Cloud.signedIn()){
      const cs = Cloud.status;
      if (cs === 'sync'){ el.className = 'save-badge sync'; el.textContent = '同步中…'; el.title = '正在推送到账号云端'; }
      else if (cs === 'fail'){ el.className = 'save-badge fail'; el.textContent = '同步失败 · 本地已存'; el.title = state.cloudError || '云端暂时连不上，稍后自动重试'; }
      else if (cs === 'ok'){ el.className = 'save-badge cloud'; el.textContent = '已同步 · 云端'; el.title = '数据已推送到账号，其他设备可拉取'; }
      else { el.className = 'save-badge'; el.textContent = '已登录 · 待同步'; el.title = '等待首次同步完成'; }
      return;
    }
    el.className = 'save-badge ' + state.save;
    el.textContent = state.save === 'ok' ? '已保存 · 本地' : '保存失败';
    el.title = state.save === 'ok' ? '数据已写入本机 localStorage（键 ' + Persist.getKey() + '）' : (state.lastError ? state.lastError.msg : '');
  }
