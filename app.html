    const ro = isReadOnly();
    document.body.classList.toggle('drawer-open', !!ev);
    if (!ev){ dr.classList.remove('open'); return; }
    const st = statusOf(ev);
    const endD = endDisp(ev);
    const days = db(ev.start, endD) + 1;
    const parent = ev.branch ? findEv(ev.branch.parent) : null;
    const children = VIEW_EVENTS.filter(x => x.branch && x.branch.parent === ev.id);
    const related = VIEW_LINKS.filter(l => l.a === ev.id || l.b === ev.id);

    /* ---- 关系详情：从核心信息里的关系行进入 ---- */
    if (state.relView){
      const lk = VIEW_LINKS.find(l => l.id === state.relView);
      if (lk){
        const A = findEv(lk.a), B = findEv(lk.b);
        const style = REL[lk.type] || REL.ref;
        const color = style.c === 'auto' ? ((A && A.color) || '#8C867B') : style.c;
        const arrow = style.arrow ? '→' : '↔';
        const side = (x, tag) => x ? `
          <div class="drow" data-jump-ev="${x.id}" style="cursor:pointer">
            <i style="background:${x.color}"></i>
            <span>（${tag}）${esc(x.title)}</span>
            <em>${ymd(x.start)}${x.end ? ' → ' + ymd(x.end) : ' 起'} · ${statusOf(x)}</em>
          </div>` : `<div class="drow"><i style="background:#DCD6C8"></i><span>（${tag}）事件已删除</span><em>—</em></div>`;
        const created = lk.createdAt ? new Date(lk.createdAt) : null;
        const fmt = d => d ? `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '—';
        const overlap = A && B ? (() => {
          const s = [A.start, B.start].sort().pop(), e = [endDisp(A), endDisp(B)].sort()[0];
          return s <= e ? `${ymd(s)} → ${ymd(e)}` : '时间上不重叠';
        })() : '—';
        dr.innerHTML = `
          <div class="drawer-head">
            <div class="row1"><span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block"></span>
              关系详情 · ${esc(style.n)}${isReadOnly()?' · 历史快照':''}</div>
            <h2 style="color:${color}">${esc(A ? A.title : '—')} ${arrow} ${esc(B ? B.title : '—')}</h2>
            <div class="desc">${esc(lk.label || style.n)}</div>
            <button class="drawer-close" id="dClose">✕</button>
          </div>
          <div class="meta-grid">
            <div><span>关系类型</span><b style="color:${color}">${esc(style.n)}</b></div>
            <div><span>建立时间</span><b>${fmt(created)}</b></div>
          </div>
          <div class="dsec">
            <h4>这条关系的含义</h4>
            <div class="result-box" style="user-select:text">${esc(style.hint)}</div>
            <div class="dlist" style="margin-top:8px">
              <div class="drow"><i style="background:${color}"></i><span>时间重叠</span><em>${overlap}</em></div>
              <div class="drow"><i style="background:${color}"></i><span>线型</span><em>${style.dash ? '虚线' : '实线'} · ${style.arrow ? '带箭头（有方向）' : '无箭头（对等）'}</em></div>
            </div>
          </div>
          <div class="dsec">
            <h4>两端事件</h4>
            <div class="dlist">
              ${side(A, style.arrow ? '起点' : 'A 端')}
              ${side(B, style.arrow ? '终点' : 'B 端')}
            </div>
          </div>
          <div class="dbody">
            <div class="acts ${isReadOnly()?'locked':''}">
              ${ro ? '' : `<button data-edit-rel="${lk.id}">✎ 编辑关系</button>`}
              <button data-rel-back="1">← 返回事件详情</button>
              ${ro ? '' : `<button class="danger" data-del-rel="${lk.id}">删除关系</button>`}
            </div>
          </div>`;
        dr.style.setProperty('--c', color);
        dr.classList.add('open');
        return;
      }
      state.relView = null;
    }

    /* ---- 附件详情：点附件行时展示这条附件的完整信息 ---- */
    if (state.attView){
      const v = state.attView;
      const ownerNd = v.kind === 'node' ? ev.nodes.find(n => n.id === v.nodeId) : null;
      const list = v.kind === 'node' ? ((ownerNd && ownerNd.att) || []) : (ev.att || []);
      const a = list.find(x => x.id === v.attId);
      if (a){
        const url = a.url || '';
        const ext = (url.split('?')[0].split('#')[0].match(/\.([a-z0-9]+)$/i) || [])[1] || '';
        const isImg = /^data:image\//.test(url) || ['png','jpg','jpeg','gif','webp','svg','bmp','avif'].includes(ext.toLowerCase());
        const kindTxt = !url ? '无链接（仅记录名称）' : isImg ? '图片 · ' + ext.toUpperCase() : (['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','csv','zip'].includes(ext.toLowerCase()) ? '文档 · ' + ext.toUpperCase() : '链接');
        const added = a.addedAt ? new Date(a.addedAt) : null;
        const fmt = d => d ? `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '—';
        dr.innerHTML = `
          <div class="drawer-head">
            <div class="row1"><span style="width:7px;height:7px;border-radius:50%;background:${ev.color};display:inline-block"></span>
              附件详情 · ${v.kind === 'node' ? '节点附件' : '事件附件'}</div>
            <h2>${esc(a.name)}</h2>
            <div class="desc">${ownerNd ? `属于节点「${esc(ownerNd.title)}」 · ${ymd(ownerNd.date)}` : `属于事件「${esc(ev.title)}」`}</div>
            <button class="drawer-close" id="dClose">✕</button>
          </div>
          <div class="meta-grid">
            <div><span>类型</span><b>${esc(kindTxt)}</b></div>
            <div><span>添加时间</span><b>${fmt(added)}</b></div>
          </div>
          ${isImg && url ? `<div class="dsec"><h4>预览</h4>
            <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center;max-height:220px">
              <img src="${esc(url)}" alt="${esc(a.name)}" style="max-width:100%;max-height:220px;display:block;object-fit:contain">
            </div>
            <div class="muted" style="font-size:11px;margin-top:6px">预览失败说明链接不可直接访问，可点下方「打开链接」用浏览器查看。</div>
          </div>` : ''}
          <div class="dsec">
            <h4>链接</h4>
            <div class="result-box ${url?'':'empty'}" style="word-break:break-all;user-select:text">${url ? esc(url) : '这个附件只记录了名称，没有链接。'}</div>
            <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
              ${url ? `<button data-att-open="${esc(url)}">↗ 打开链接</button>
                       <button data-att-copy="${esc(url)}">⧉ 复制链接</button>` : ''}
            </div>
          </div>
          <div class="dbody">
            <div class="acts">
              <button data-att-back="1">← 返回${v.kind === 'node' ? '节点详情' : '事件详情'}</button>
              ${ro ? '' : `<button class="danger" data-att-del="${a.id}" data-kind="${v.kind}">删除附件</button>`}
            </div>
          </div>`;
        dr.style.setProperty('--c', ev.color);
        dr.classList.add('open');
        return;
      }
      state.attView = null;   /* 附件已被删除，退回上一层 */
    }

    /* ---- 单节点视图：点某个进展节点时只展示这条节点的详情 ---- */
    const focusNd = state.focusNode ? ev.nodes.find(n => n.id === state.focusNode) : null;
    if (focusNd){
      const sorted = ev.nodes.slice().sort(sortNodes);
      const idx = sorted.findIndex(n => n.id === focusNd.id);
      const prev = idx > 0 ? sorted[idx - 1] : null;
      const next = idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null;
      const dayNo = db(ev.start, focusNd.date) + 1;
      const fAtt = focusNd.att || [];
      dr.innerHTML = `
        <div class="drawer-head">
          <div class="row1"><span style="width:7px;height:7px;border-radius:50%;background:${ev.color};display:inline-block"></span>
            节点详情 · 第 ${dayNo} 天${isReadOnly()?' · 历史快照':''}</div>
          <h2>${esc(focusNd.title)}</h2>
          ${focusNd.text ? `<div class="desc">${esc(focusNd.text)}</div>` : '<div class="desc" style="color:var(--muted)">这条节点还没有补充说明</div>'}
          <button class="drawer-close" id="dClose">✕</button>
        </div>
        <div class="meta-grid">
          <div><span>日期</span><b>${md(focusNd.date)}</b></div>
          <div><span>第几天</span><b>${dayNo} 天</b></div>
          <div><span>节点序号</span><b>${idx + 1} / ${sorted.length}</b></div>
        </div>
        ${isReadOnly() ? `<div class="ro-note">历史回放模式：这里只展示 ${ymd(state.replay)} 当时的状态，所有修改入口已锁定。</div>` : ''}
        <div class="acts ${isReadOnly()?'locked':''}">
          <button data-nedit="${focusNd.id}" ${ro?'disabled':''}>✎ 编辑节点</button>
          <button data-nbranch="${focusNd.id}" ${ro?'disabled':''}>⑂ 从此刻分支</button>
          <button data-natt="${focusNd.id}" ${ro?'disabled':''}>📎 节点附件</button>
          <button data-nback="1">← 事件详情</button>
          <button class="danger" data-ndel="${focusNd.id}" ${ro?'disabled':''}>删除节点</button>
        </div>
        <div class="dbody">
          <div class="dsec">
            <h4>所属事件</h4>
            <div class="dlist">
              <div class="drow" data-nback="1" style="cursor:pointer"><i style="background:${ev.color}"></i>
                <span>${esc(ev.title)}</span><em>${md(ev.start)} 起 · ${statusOf(ev)}</em></div>
              ${prev ? `<div class="drow" data-jump-node="${prev.id}" style="cursor:pointer"><i style="background:#DCD6C8"></i><span>↑ 上一条 · ${esc(prev.title)}</span><em>${md(prev.date)}</em></div>` : ''}
              ${next ? `<div class="drow" data-jump-node="${next.id}" style="cursor:pointer"><i style="background:#DCD6C8"></i><span>↓ 下一条 · ${esc(next.title)}</span><em>${md(next.date)}</em></div>` : ''}
            </div>
          </div>
          ${fAtt.length ? `<div class="dsec"><h4>节点附件 · ${fAtt.length}</h4><div class="dlist">
            ${fAtt.map(a => `<div class="drow att" data-att-view="${a.id}" data-kind="node" data-node="${focusNd.id}" style="cursor:pointer" title="点击查看附件详情">
              <i style="background:${ev.color}"></i><span>${esc(a.name)}</span><em>${a.url ? '有链接' : '仅名称'}</em>
              ${isReadOnly()?'':`<button class="mini-del" data-att-del="${a.id}" data-kind="node">✕</button>`}</div>`).join('')}
          </div></div>` : ''}
          <div class="dsec">
            <h4>这条节点的完整记录</h4>
            <div class="result-box ${focusNd.text?'':'empty'}">${focusNd.text ? esc(focusNd.text) : '尚无说明，可点「编辑节点」补充背景、结果与附件。'}</div>
          </div>
        </div>`;
      dr.style.setProperty('--c', ev.color);
      dr.classList.add('open');
      return;
    }

    const nodes = ev.nodes.slice().sort(sortNodes).map(n => `
      <div class="pitem">
        <div class="pdate">${ymd(n.date)} · 第 ${db(ev.start, n.date)+1} 天${state.focusNode===n.id?'<span class="ptag">当前查看</span>':''}</div>
        <div class="ptitle">${esc(n.title)}</div>
        ${n.text ? `<div class="ptext">${esc(n.text)}</div>` : ''}
        ${(n.att||[]).length ? `<div class="att-chips">${n.att.map(a => `
          <button class="att-chip" data-att-view="${a.id}" data-kind="node" data-node="${n.id}" title="点击查看附件详情">
            <span>📎 ${esc(a.name)}</span><span class="cnt">${a.url ? '↗' : '·'}</span></button>`).join('')}</div>` : ''}
        <div class="pacts">
          <button data-nedit="${n.id}">编辑</button>
          <button data-nbranch="${n.id}">从此分支</button>
          <button data-natt="${n.id}">附件</button>
          <button class="del" data-ndel="${n.id}">删除</button>
        </div>
      </div>`).join('');

    dr.innerHTML = `
      <div class="drawer-head">
        <div class="row1"><span style="width:7px;height:7px;border-radius:50%;background:${ev.color};display:inline-block"></span>
          ${esc(ev.category || '未分类')} · 事件生命线${ev.branch?' · 分支':''}${isReadOnly()?' · 历史快照':''}</div>
        <h2>${esc(ev.title)}</h2>
        ${ev.desc ? `<div class="desc">${esc(ev.desc)}</div>` : ''}
        <button class="drawer-close" id="dClose">✕</button>
      </div>
      <div class="meta-grid">
        <div><span>开始</span><b>${ymd(ev.start)}${ev.startTime && ev.startTime!=='00:00' ? ' ' + ev.startTime : ''}</b></div>
        <div><span>${ev.end ? '结束' : '状态'}</span><b style="color:${st==='进行中'?ev.color:'inherit'}">${ev.end ? ymd(ev.end) : st}</b></div>
        <div><span>持续</span><b>${days} 天</b></div>
      </div>
      ${isReadOnly() ? `<div class="ro-note">历史回放模式：这里只展示 ${ymd(state.replay)} 当时的状态，所有修改入口已锁定。</div>` : ''}
      <div class="acts ${isReadOnly()?'locked':''}">
        <button data-act="edit" ${ro?'disabled':''}>✎ 编辑</button>
        <button data-act="progress" ${ro?'disabled':''}>＋ 进展</button>
        <button data-act="branch" ${ro?'disabled':''}>⑂ 分支</button>
        ${ev.end ? `<button data-act="reopen" ${ro?'disabled':''}>↺ 恢复进行</button>` : `<button data-act="end" ${ro?'disabled':''}>■ 结束</button>`}
        <button data-act="link" ${ro?'disabled':''}>⇄ 关联</button>
        <button data-act="att" ${ro?'disabled':''}>📎 附件</button>
        <button data-act="delete" class="danger" ${ro?'disabled':''}>删除</button>
      </div>
      <div class="dbody">
        <div class="dsec">
          <h4>最终结果 ${(!ro && ev.end) ? '<button data-act="result">编辑</button>' : ''}</h4>
          <div class="result-box ${ev.result?'':'empty'}">${ev.end ? (ev.result ? esc(ev.result) : '还没有记录结果') : '事件尚未结束'}</div>
        </div>
        <div class="dsec">
          <h4>核心信息</h4>
          <div class="dlist">
            <div class="drow"><i style="background:${ev.color}"></i><span>进展节点</span><em>${ev.nodes.length} 条</em></div>
            ${parent ? `<div class="drow" data-jump-ev="${parent.id}" style="cursor:pointer"><i style="background:${parent.color}"></i><span>父事件 · ${esc(parent.title)}</span><em>${md(ev.branch.date)}</em></div>` : ''}
            ${children.map(c => `<div class="drow" data-jump-ev="${c.id}" style="cursor:pointer"><i style="background:${c.color}"></i><span>子分支 · ${esc(c.title)}</span><em>${md(c.start)}</em></div>`).join('')}
            ${related.map(l => {
              const other = findEv(l.a === ev.id ? l.b : l.a);
              if (!other) return '';
              const rc = REL[l.type] && REL[l.type].c !== 'auto' ? REL[l.type].c : '#8C867B';
              const direct = l.a === ev.id ? '→' : '←';
              return `<div class="drow rel" data-rel-view="${l.id}" style="cursor:pointer" title="点击查看关系详情"><i style="background:${rc}"></i>
                <span>${REL[l.type]?REL[l.type].n:'关联'} · ${esc(other.title)}</span><em>${direct} ${esc(l.label)}</em></div>`;
            }).join('')}
          </div>
        </div>
        ${(ev.att||[]).length ? `<div class="dsec"><h4>附件 · ${ev.att.length}</h4><div class="dlist">
          ${ev.att.map(a => `<div class="drow att" data-att-view="${a.id}" data-kind="event" style="cursor:pointer" title="点击查看附件详情">
            <i style="background:${ev.color}"></i><span>${esc(a.name)}</span><em>${a.url ? '有链接' : '仅名称'}</em>
            ${isReadOnly()?'':`<button class="mini-del" data-att-del="${a.id}" data-kind="event">✕</button>`}</div>`).join('')}
        </div></div>` : ''}
        <div class="dsec">
          <h4>历史进展 · ${ev.nodes.length}</h4>
          ${nodes || `<div class="empty-note">还没有进展记录。点击生命线上的任意日期即可添加。</div>`}
        </div>
      </div>`;
    dr.style.setProperty('--c', ev.color);
    dr.classList.add('open');
  }

  return { all, grid, lanes, links, header, stats, views, panel, pill, drawer, syncScroll, saveBadge, relVisible };
})();

/* ===================== 10. UI：弹层与提示 ===================== */
const UI = (() => {
  function toast(msg){
    const box = document.getElementById('toasts'); if (!box) return;
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .2s'; }, 1900);
    setTimeout(() => el.remove(), 2200);
  }

  const modalEl = document.getElementById('modal');
  let submitHandler = null;

  function fieldHTML(f){
    const v = f.value == null ? '' : f.value;
    if (f.type === 'text') return `<div class="field"><label>${f.label}</label><input type="text" data-key="${f.key}" value="${esc(v)}" placeholder="${esc(f.placeholder||'')}"></div>`;
    if (f.type === 'date') return `<div class="field"><label>${f.label}</label><input type="date" data-key="${f.key}" value="${esc(v)}"></div>`;
    if (f.type === 'time') return `<div class="field"><label>${f.label}</label><input type="time" data-key="${f.key}" value="${esc(v || '00:00')}"></div>`;
    if (f.type === 'textarea') return `<div class="field"><label>${f.label}</label><textarea data-key="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    if (f.type === 'select') return `<div class="field"><label>${f.label}</label><select data-key="${f.key}">${f.options.map(o=>`<option value="${esc(o.v)}" ${o.v===v?'selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`;
    if (f.type === 'color') return `<div class="field"><label>${f.label}</label>
      <div class="swatches" data-key="${f.key}">${PALETTE.map(c=>`<button class="swatch ${c===v?'on':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>
      <input type="hidden" data-key-hidden="${f.key}" value="${esc(v || PALETTE[0])}"></div>`;
    return '';
  }

  function open(cfg){
    if (!cfg.okOnly) submitHandler = cfg.onSubmit || null;
    modalEl.innerHTML = `<div class="modal-card ${cfg.wide?'wide':''}">
      <div class="modal-head"><h3>${cfg.title}</h3><button class="drawer-close" data-close>✕</button></div>
      ${cfg.desc ? `<p class="modal-desc">${cfg.desc}</p>` : ''}
      <div class="modal-body">${cfg.html ? cfg.html : (cfg.fields||[]).map(fieldHTML).join('')}</div>
      <div class="modal-foot">
        <button class="btn ghost" data-close>${cfg.cancel || (cfg.okOnly ? '关闭' : '取消')}</button>
        ${cfg.ok ? `<button class="btn solid" id="modalOk">${cfg.ok}</button>` : ''}
      </div></div>`;
    modalEl.classList.add('open');
    modalEl.querySelectorAll('.swatch').forEach(sw => {
      sw.onclick = () => {
        const key = sw.closest('.swatches').dataset.key;
        modalEl.querySelectorAll(`.swatches[data-key="${key}"] .swatch`).forEach(x => x.classList.remove('on'));
        sw.classList.add('on');
        modalEl.querySelector(`[data-key-hidden="${key}"]`).value = sw.dataset.color;
      };
    });
    modalEl.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
    const ok = document.getElementById('modalOk');
    if (ok) ok.onclick = () => {
      const vals = {};
      modalEl.querySelectorAll('[data-key]').forEach(el => {
        if (['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) vals[el.dataset.key] = (el.value || '').trim();
      });
      modalEl.querySelectorAll('[data-key-hidden]').forEach(el => vals[el.dataset.keyHidden] = el.value);
      if (submitHandler) submitHandler(vals);
    };
    setTimeout(() => { const i = modalEl.querySelector('input[type=text],textarea'); if (i) i.focus(); }, 60);
  }
  function close(){ modalEl.classList.remove('open'); modalEl.innerHTML = ''; submitHandler = null; }

  /* 统一确认框（替代原生 confirm，可测、可样式化） */
  function confirmBox(title, desc, okText, onOk, opt = {}){
    open({ title, desc, ok: okText || '确认', cancel:'取消',
      html: opt.html || '', onSubmit(){ close(); onOk && onOk(); } });
  }

  modalEl.addEventListener('click', e => { if (e.target === modalEl) close(); });
  modalEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA'){
      const ok = document.getElementById('modalOk');
      if (ok){ e.preventDefault(); ok.click(); }
    }
  });

  return { toast, open, close, confirmBox, get isOpen(){ return modalEl.classList.contains('open'); } };
})();

/* 关系浮层 */
const RelPop = (() => {
  let id = null;
  function open(rid, clientX, clientY){
    const rp = document.getElementById('relPop');
    id = rid;
    let html = '';
    if (rid.indexOf('br-') === 0){
      const child = findEv(rid.slice(3));
      if (!child) return;
      const parent = child.branch ? findEv(child.branch.parent) : null;
      html = `<div class="rp-type" style="color:${child.color}">◆ 父子分支</div>
        <div class="rp-name">${esc(parent ? parent.title : '父事件已删除')} → ${esc(child.title)}</div>
        <div class="rp-label">分支来源：${child.branch ? ymd(child.branch.date) : '—'}</div>
        <div class="rp-acts"><button data-jump-ev="${parent?parent.id:''}">父事件</button><button data-jump-ev="${child.id}">子事件</button>
        ${isReadOnly()?'':`<button class="del" data-del-rel="${rid}">解除</button>`}</div>`;
    } else {
      const lk = VIEW_LINKS.find(l => l.id === rid); if (!lk) return;
      const A = findEv(lk.a), B = findEv(lk.b);
      const style = REL[lk.type] || REL.ref;
      const dot = style.c === 'auto' ? ((A && A.color) || '#8C867B') : style.c;
      const created = lk.createdAt ? new Date(lk.createdAt) : null;
      const arrow = style.arrow ? '→' : '↔';
      html = `<div class="rp-type" style="color:${dot}">${style.n}</div>
        <div class="rp-name">${esc(A ? A.title : '—')} ${arrow} ${esc(B ? B.title : '—')}</div>
        <div class="rp-label">${esc(lk.label)}<br>
          <span style="opacity:.7">A：${A ? md(A.start) + (A.end ? '→' + md(A.end) : ' 起') : '—'}<br>
          B：${B ? md(B.start) + (B.end ? '→' + md(B.end) : ' 起') : '—'}</span><br>
          ${created ? '建立于 ' + created.getFullYear() + '.' + pad(created.getMonth()+1) + '.' + pad(created.getDate()) : ''}<br>
          ${style.hint}</div>
        <div class="rp-acts"><button data-rel-detail="${rid}">详情</button>${isReadOnly()?'':`<button data-edit-rel="${rid}">编辑</button><button class="del" data-del-rel="${rid}">删除</button>`}</div>`;
    }
    rp.innerHTML = html;
    rp.classList.add('open');
    const w = 250, h = 130;
    rp.style.left = Math.min(window.innerWidth - w - 12, clientX + 12) + 'px';
    rp.style.top = Math.min(window.innerHeight - h - 12, clientY + 12) + 'px';
  }
  function close(){ document.getElementById('relPop').classList.remove('open'); id = null; }
  return { open, close, get id(){ return id; }, isOpen: () => document.getElementById('relPop').classList.contains('open') };
})();

/* ===================== 11. Actions：业务动作（数据层，可被 UI 与测试直接调用） ===================== */
const Actions = (() => {

  function createEvent(p){
    const start = p.start || TODAY;
    if (!isDate(start)) return false;
    const ev = normEvent({
      id: uid('e'), title: (p.title || '').trim() || '未命名事件',
      color: p.color || PALETTE[0], start, startTime: p.startTime || '00:00',
      category: p.category || '未分类', desc: p.desc || '', nodes: [],
      createdAt: Date.now(),
    });
    const done = commit(() => { EVENTS.push(ev); EVENTS = sortEvents(EVENTS); });
    if (!done) return false;
    state.selected = ev.id; Render.all();
    return ev.id;
  }

  function updateEvent(id, patch, opts = {}){
    const ev = findLive(id); if (!ev) return false;
    const next = { start: patch.start || ev.start, end: ('end' in patch) ? (patch.end || null) : ev.end };
    if (!isDate(next.start)){ UI.toast('开始日期不合法'); return false; }
    if (next.end && (!isDate(next.end) || next.end < next.start)){ UI.toast('结束日期必须晚于开始日期'); return false; }
    const impact = dateImpact(ev, next);
    if (!opts.force && (impact.hard.length || impact.soft.length)){
      UI.confirmBox('修改日期会影响已有数据',
        `<div class="impact">${impact.hard.map(x=>`<p>· ${x}</p>`).join('')}${impact.soft.map(x=>`<p>· ${x}</p>`).join('')}
         <p class="muted">确认后：超出新范围的进展节点会移动到边界日期。</p></div>`,
        '仍然修改', () => updateEvent(id, patch, { force:true }));
      return false;
    }
    const done = commit(() => {
      ev.title = (patch.title || ev.title);
      ev.category = patch.category || ev.category;
      ev.color = patch.color || ev.color;
      ev.desc = 'desc' in patch ? patch.desc : ev.desc;
      ev.startTime = patch.startTime || ev.startTime;
      ev.start = next.start;
      ev.end = next.end;
      ev.updatedAt = Date.now();
      /* 节点越界：按用户确认的规则夹到边界，而不是静默丢弃 */
      ev.nodes.forEach(n => {
        if (n.date < ev.start) n.date = ev.start;
        if (ev.end && n.date > ev.end) n.date = ev.end;
      });
      ev.nodes.sort(sortNodes);
      /* 子分支若来源日期失效，保留来源但标记为待修复 */
      EVENTS.filter(c => c.branch && c.branch.parent === ev.id).forEach(c => {
        if (c.start < ev.start) c.start = ev.start;
      });
    });
    return done;
  }

  function addNode(id, p){
    const ev = findLive(id); if (!ev) return false;
    if (!isDate(p.date)){ UI.toast('节点日期不合法'); return false; }
    const cut = TODAY;
    const hi = ev.end || cut;
    if (p.date < ev.start || p.date > hi){ UI.toast('节点日期需在事件有效区间内'); return false; }
    const sameDay = ev.nodes.filter(n => n.date === p.date);
    const node = normEvent({ start:p.date, nodes:[{ id:uid('n'), date:p.date, title:p.title, text:p.text }] }).nodes[0];
    node.sequence = (sameDay.reduce((m,n) => Math.max(m, n.sequence || 0), 0) || 0) + 1;
    node.createdAt = Date.now();
    return commit(() => { ev.nodes.push(node); ev.nodes.sort(sortNodes); });
  }

  function updateNode(id, nodeId, p){
    const ev = findLive(id), n = ev && ev.nodes.find(x => x.id === nodeId); if (!n) return false;
    if (!isDate(p.date)){ UI.toast('节点日期不合法'); return false; }
    const hi = ev.end || TODAY;
    if (p.date < ev.start || p.date > hi){ UI.toast('节点日期需在事件有效区间内'); return false; }
    return commit(() => {
      n.date = p.date; n.title = p.title || n.title;
      if ('text' in p) n.text = p.text;
      n.updatedAt = Date.now(); n.sequence = n.sequence || 1;
      ev.nodes.sort(sortNodes);
    });
  }

  function moveNode(id, nodeId, date){
    const ev = findLive(id), n = ev && ev.nodes.find(x => x.id === nodeId); if (!n) return false;
    const hi = ev.end || TODAY;
    if (date < ev.start || date > hi){ UI.toast('不能拖出事件的有效时间范围（' + ymd(ev.start) + ' → ' + ymd(hi) + '）'); return false; }
    return commit(() => {
      n.date = date; n.updatedAt = Date.now();
      const same = ev.nodes.filter(x => x.date === date && x.id !== n.id);
      n.sequence = (same.reduce((m,x) => Math.max(m, x.sequence || 0), 0) || 0) + 1;
      ev.nodes.sort(sortNodes);
      /* 分支来源日期跟随节点一起移动（保持分支指向具体来源） */
      EVENTS.forEach(c => { if (c.branch && c.branch.parent === ev.id && c.branch.date === ev.start) return; });
    });
  }

  function deleteNode(id, nodeId){
    const ev = findLive(id); if (!ev) return false;
    const n = ev.nodes.find(x => x.id === nodeId); if (!n) return false;
    return commit(() => {
      ev.nodes = ev.nodes.filter(x => x.id !== nodeId);
      if (state.focusNode === nodeId) state.focusNode = null;
    });
  }

  function createBranch(parentId, date, p, opts = {}){
    const parent = findLive(parentId); if (!parent) return false;
    if (!isDate(date) || date < parent.start || date > (parent.end || TODAY)){ UI.toast('分支来源日期不合法'); return false; }
    if (p.start && p.start < date){
      if (!opts.force){
        UI.confirmBox('分支开始早于来源节点', `分支开始日 ${ymd(p.start)} 早于父事件来源节点 ${ymd(date)}，会导致时间线倒挂。`, '仍然创建', () => createBranch(parentId, date, p, { force:true }));
        return false;
      }
    }
    const start = p.start || date;
    const ev = normEvent({
      id: uid('e'), title: p.title || '分支事件', color: p.color || PALETTE[4],
      start, startTime: p.startTime || '00:00', category: p.category || parent.category,
      branch: { parent: parentId, date }, nodes: p.text ? [{ date:start, title:'分支起点', text:p.text }] : [],
      createdAt: Date.now(),
    });
    return commit(() => { EVENTS.push(ev); EVENTS = sortEvents(EVENTS); })
      ? (state.selected = ev.id, Render.all(), ev.id) : false;
  }

  function endEvent(id, date){
    const ev = findLive(id); if (!ev) return false;
    if (!isDate(date) || date < ev.start){ UI.toast('结束日期不能早于开始日期'); return false; }
    return commit(() => {
      ev.end = date;
      ev.nodes = ev.nodes.filter(n => n.date <= date);   /* 结束日之后的节点不允许存在 */
      ev.updatedAt = Date.now();
    });
  }

  function reopen(id){
    const ev = findLive(id); if (!ev) return false;
    return commit(() => { ev.end = null; ev.updatedAt = Date.now(); });
  }

  function removeEvent(id){
    const ev = findLive(id); if (!ev) return false;
    if (isReadOnly()) return false;
    return commit(() => {
      TRASH.unshift({ ev: clone(ev), at: Date.now() });
      if (TRASH.length > 30) TRASH.pop();
      EVENTS = EVENTS.filter(x => x.id !== id);
      LINKS = LINKS.filter(l => l.a !== id && l.b !== id);
      EVENTS.forEach(x => {
        if (x.branch && x.branch.parent === id){
          x.orphanOf = { id, title: ev.title, date: x.branch.date };   /* 保留来源历史 */
          x.branch = null;
        }
      });
      if (state.selected === id){ state.selected = null; state.focusNode = null; }
    });
  }

  function restoreTrash(idx){
    const item = TRASH[idx]; if (!item) return false;
    return commit(() => {
      const ev = normEvent(clone(item.ev));
      EVENTS.push(ev); EVENTS = sortEvents(EVENTS);
      TRASH.splice(idx, 1);
      state.selected = ev.id;
    });
  }

  function setResult(id, text){
    const ev = findLive(id); if (!ev) return false;
    return commit(() => { ev.result = text || ''; ev.updatedAt = Date.now(); });
  }

  function attach(kind, id, nodeId, p){
    if (!p || !p.name){ UI.toast('请填写附件名称'); return false; }
    const att = { id: uid('a'), name: p.name, url: p.url || '', addedAt: Date.now() };
    const ev = findLive(id); if (!ev) return false;
    const target = kind === 'node' ? ev.nodes.find(x => x.id === nodeId) : ev;
    if (!target) return false;
    return commit(() => { target.att = target.att || []; target.att.push(att); });
  }

  function detach(kind, id, nodeId, attId){
    const ev = findLive(id); if (!ev) return false;
    const target = kind === 'node' ? ev.nodes.find(x => x.id === nodeId) : ev;
    if (!target || !target.att) return false;
    return commit(() => { target.att = target.att.filter(a => a.id !== attId); });
  }

  function link(a, b, type, label){
    if (!a || !b || a === b){ UI.toast('不能与自己建立关系'); return false; }
    if (!findLive(a) || !findLive(b)){ UI.toast('事件不存在'); return false; }
    if (LINKS.some(l => ((l.a===a&&l.b===b)||(l.b===a&&l.a===b)) && l.type === type)){
      UI.toast('这两个事件已经有同类型关系了'); return false;
    }
    const lk = { id: uid('l'), a, b, type: REL[type]?type:'ref', label: label || (REL[type]||REL.ref).n, createdAt: Date.now() };
    return commit(() => { LINKS.push(lk); });
  }

  function updateLink(id, patch){
    const lk = LINKS.find(l => l.id === id); if (!lk) return false;
    return commit(() => {
      lk.type = REL[patch.type] ? patch.type : lk.type;
      lk.label = patch.label || REL[lk.type].n;
    });
  }

  function unlink(id){
    if (id.indexOf('br-') === 0){
      const child = findLive(id.slice(3)); if (!child) return false;
      return commit(() => {
        child.orphanOf = child.branch ? { id: child.branch.parent, title: (findLive(child.branch.parent)||{}).title, date: child.branch.date } : null;
        child.branch = null;
      });
    }
    if (!LINKS.some(l => l.id === id)) return false;
    return commit(() => { LINKS = LINKS.filter(l => l.id !== id); });
  }

  function replaceAll(o){ return Import.apply(o); }

  function clearAll(){
    if (isReadOnly()){ UI.toast('回放只读'); return false; }
    Hist.push();
    EVENTS = []; LINKS = []; TRASH = []; JOURNAL = [];
    state.selected = null; state.replay = null;
    Persist.save(); Render.all();
    return true;
  }

  function loadSample(){
    if (isReadOnly()){ UI.toast('回放只读'); return false; }
    Hist.push();
    Import.apply({ schema:'timeflow', version:3, events: clone(SAMPLE.events), links: clone(SAMPLE.links) }, true);
    Persist.save(); Render.all();
    return true;
  }

  return { createEvent, updateEvent, addNode, updateNode, moveNode, deleteNode, createBranch, endEvent, reopen,
    removeEvent, restoreTrash, setResult, attach, detach, link, updateLink, unlink,
    replaceAll, clearAll, loadSample };
})();

/* ===================== 12. 滚动与视图工具 ===================== */
function scrollToDate(d, smooth){
  const stage = document.getElementById('stage');
  const top = Math.max(0, yOf(d) - stage.clientHeight * 0.6);
  stage.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
}
function scrollInitial(){
  const stage = document.getElementById('stage');
  const starts = VIEW_EVENTS.map(e => e.start).sort();
  const first = starts[0] || TODAY;
  const top = yOf(first) - 64;
  const bottom = yOf(cutDate()) + 16;
  if (bottom - top <= stage.clientHeight - 6) stage.scrollTop = Math.max(0, top);
  else stage.scrollTop = Math.max(0, Math.max(top, yOf(cutDate()) - stage.clientHeight * 0.82));
}
function revealLane(id){
  const l = laneOf(id); if (!l) return;
  const stage = document.getElementById('stage');
  const drawerOpen = document.getElementById('drawer').classList.contains('open');
  const visW = stage.clientWidth - (drawerOpen ? 404 : 0);
  if (l.x < stage.scrollLeft + 60 || l.x + l.w > stage.scrollLeft + visW - 40)
    stage.scrollTo({ left: Math.max(0, l.x - 110), behavior:'smooth' });
}
function selectEvent(id){
  state.selected = id; state.focusNode = null; state.attView = null; state.relView = null;
  Render.all(); revealLane(id);
}
function selectNode(evId, nodeId){
  state.selected = evId; state.focusNode = nodeId; state.attView = null; state.relView = null;
  Render.all(); revealLane(evId);
}
function togglePanel(force){
  const panelEl = document.getElementById('panel');
  const open = typeof force === 'boolean' ? force : !panelEl.classList.contains('open');
  panelEl.classList.toggle('open', open);
  document.getElementById('menuBtn').classList.toggle('active', open);
  if (open) Render.panel();
}

/* 缩放：只改视觉密度，锚定当前关注日期 */
function setView(i){
  const stage = document.getElementById('stage');
  const anchorY = stage.scrollTop + stage.clientHeight * 0.4;
  const anchorDate = dateAtY(anchorY);
  Engine.setView(i);
  Render.all();
  stage.scrollTop = Math.max(0, yOf(anchorDate) - stage.clientHeight * 0.4);
}
function zoomBy(dir){
  const i = Math.min(VIEWS.length - 1, Math.max(0, state.view + dir));
  if (i === state.view) return;
  setView(i);
  UI.toast('视图 · ' + VIEWS[i].n + (VIEWS[i].band ? '（按' + (VIEWS[i].band === 'week' ? '周' : VIEWS[i].band === 'month' ? '月' : '年') + '聚合）' : ''));
}

function startReplay(d){
  if (!isDate(d)){ UI.toast('回放日期不合法'); return; }
  if (d > TODAY){ UI.toast('不能回放未来日期'); return; }
  state.replay = d;
  state.selected = null; state.focusNode = null;
  Render.all(); scrollToDate(d, true);
  UI.toast('历史回放 · ' + ymd(d) + '（只读，真实数据不会被修改）');
}
function exitReplay(){
  state.replay = null;
  Render.all(); scrollToDate(TODAY, false);
  UI.toast('已退出回放，数据未改变');
}

    onSubmit(v){ Actions.setResult(id, v.result); UI.close(); UI.toast('结果已保存'); }
  });
}

function formAttachment(kind, id, nodeId){
  UI.open({
    title:'添加附件',
    desc:'附件以「名称 + 链接」形式随事件一起持久保存（不写入本地文件内容）。',
    fields:[
      { type:'text', key:'name', label:'附件名称', placeholder:'例如：需求文档 / 会议纪要' },
      { type:'text', key:'url', label:'链接（可留空）', placeholder:'https://…' },

    ok:'添加',
    onSubmit(v){

}

function formLink(id){
  const ev = findLive(id);
  const options = EVENTS.filter(e => e.id !== id).map(e => ({ v:e.id, t:e.title + (e.branch ? '（分支）' : '') }));
  if (!options.length){ UI.toast('还没有其它事件可以关联'); return; }
  UI.open({
    title:'建立关联',
    desc:'不同类型的关系线使用不同的颜色、线型与箭头。',
    fields:[
      { type:'select', key:'target', label:'关联到', options },
      { type:'select', key:'type', label:'关系类型', options:[
        { v:'cause', t:'直接导致 · 前者直接引出后者的结果' },
        { v:'require', t:'前置条件 · 前者未完成，后者无法开始' },
        { v:'follow', t:'后续发展 · 后者是前者时间上的延续' },
        { v:'concurrent', t:'同时进行 · 两条事件并行推进' },
        { v:'support', t:'提供支持 · 前者为后者提供资源或能力' },
        { v:'conflict', t:'相互冲突 · 时间或资源互相挤占' },
        { v:'sub', t:'子事件 · 从主事件派生出的从属事件' },
        { v:'ref', t:'相互参照 · 互为背景，彼此引用' } ] },
      { type:'text', key:'label', label:'关系说明', placeholder:'例如：互为支撑 / 排期冲突' },
    ],
    ok:'建立关联',
    onSubmit(v){
      if (Actions.link(id, v.target, v.type, v.label)){ UI.close(); UI.toast('已建立关联 · ' + REL[v.type].n); }
    }
  });
}

function formEditRelation(relId){
  const lk = LINKS.find(l => l.id === relId); if (!lk) return;
  const A = findEv(lk.a), B = findEv(lk.b);
  UI.open({
    title:'编辑关系',
    desc:`${esc(A ? A.title : '')} ↔ ${esc(B ? B.title : '')}`,
    fields:[
      { type:'select', key:'type', label:'关系类型', value:lk.type, options:[
        { v:'cause', t:'直接导致' }, { v:'require', t:'前置条件' }, { v:'follow', t:'后续发展' },
        { v:'concurrent', t:'同时进行' }, { v:'support', t:'提供支持' }, { v:'conflict', t:'相互冲突' },
        { v:'sub', t:'子事件' }, { v:'ref', t:'相互参照' },
        { v:'link', t:'相互参照（旧类型）' }, { v:'dep', t:'前置条件（旧类型）' }, { v:'feedback', t:'提供支持（旧类型）' } ] },
      { type:'text', key:'label', label:'关系说明', value:lk.label },
    ],
    ok:'保存',
    onSubmit(v){ Actions.updateLink(relId, v); UI.close(); UI.toast('关系已更新'); }
  });
}

function formDeleteEvent(id){
  const ev = findLive(id); if (!ev) return;
  const kids = EVENTS.filter(x => x.branch && x.branch.parent === id);
  UI.confirmBox('删除事件', `删除「${esc(ev.title)}」？会移入回收站（可恢复）；${kids.length ? `其 ${kids.length} 条子分支的来源记录会保留为孤儿记录。` : ''}`, '移入回收站', () => {
    if (Actions.removeEvent(id)) UI.toast('已移入回收站');
  });
}

/* ===================== 14. 交互绑定 ===================== */
(function bind(){
  const stageEl = document.getElementById('stage');
  const lanesEl = document.getElementById('lanes');
  const drawerEl = document.getElementById('drawer');
  const panelEl = document.getElementById('panel');
  const modalEl = document.getElementById('modal');
  let suppressClick = false;
  const holdClick = () => { suppressClick = true; setTimeout(() => { suppressClick = false; }, 80); };

  stageEl.addEventListener('scroll', Render.syncScroll, { passive:true });

  /* --- 节点拖动（带合法性校验） --- */
  let drag = null;
  lanesEl.addEventListener('pointerdown', e => {
    if (isReadOnly()) return;
    const dot = e.target.closest('.node'); if (!dot) return;
    const ev = findEv(dot.dataset.ev); if (!ev) return;
    const n = ev.nodes.find(x => x.id === dot.dataset.node); if (!n) return;
    try { dot.setPointerCapture(e.pointerId); } catch(err){}
    drag = { ev, n, el: dot, y0: e.clientY, baseTop: parseFloat(dot.style.top),
      lbl: document.querySelector(`.node-label[data-node="${n.id}"]`), lblTop: null, moved:false };
    if (drag.lbl) drag.lblTop = parseFloat(drag.lbl.style.top);
  });

  let pinch = null;
  stageEl.addEventListener('touchstart', e => {
    if (e.touches.length === 2) pinch = { d0: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) };
  }, { passive:true });
  stageEl.addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2 && !isReadOnly()){
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (Math.abs(d - pinch.d0) > 36){ zoomBy(d < pinch.d0 ? 1 : -1); pinch = null; }
    }
  }, { passive:true });

  document.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    if (!drag.moved && Math.abs(dy) < 5) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    drag.el.style.top = (drag.baseTop + dy) + 'px';
    if (drag.lbl && drag.lblTop != null) drag.lbl.style.top = (drag.lblTop + dy) + 'px';
  });

  document.addEventListener('pointerup', e => {
    if (!drag) return;
    if (drag.moved){
      const y = e.clientY - stageEl.getBoundingClientRect().top + stageEl.scrollTop;
      const d = dateAtY(y);
      const ok = Actions.moveNode(drag.ev.id, drag.n.id, d);
      if (ok) UI.toast('节点日期已调整为 ' + ymd(d));
      Render.all(); holdClick();
    }
    drag = null;
  });

  /* --- 滚轮缩放 --- */
  stageEl.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (isReadOnly()) return;
    zoomBy(e.deltaY > 0 ? 1 : -1);
  }, { passive:false });

  /* --- 主点击分发 --- */
  document.addEventListener('click', e => {
    if (suppressClick){ e.preventDefault(); return; }

    if (e.target.closest('#newBtn')){ if (isReadOnly()) { UI.toast('回放只读'); return; } formNewEvent(TODAY); return; }
    if (e.target.closest('#menuBtn')){ togglePanel(); return; }
    if (e.target.closest('.today-txt')){ scrollToDate(cutDate(), true); return; }
    const vb = e.target.closest('[data-view]'); if (vb){ setView(Number(vb.dataset.view)); return; }

    const isoBtn = e.target.closest('[data-iso]');
    if (isoBtn){
      const id = isoBtn.dataset.iso;
      state.isolate = (state.isolate === id) ? null : id;
      Render.all();
      if (state.isolate){
        const ev = findEv(id);
        UI.toast('只看「' + (ev ? ev.title : '该事件') + '」及其关联 · ' + isoSet(id).size + ' 条轨道');
      } else UI.toast('已恢复显示全部事件');
      return;
    }
    if (e.target.closest('#isoChip')){ state.isolate = null; Render.all(); UI.toast('已恢复显示全部事件'); return; }
    const colBtn = e.target.closest('[data-collapse]');
    if (colBtn){ const ev = findLive(colBtn.dataset.collapse); if (ev) commit(() => { ev.collapsed = !ev.collapsed; }); return; }
    /* 折叠态：整块卡片点击即展开（点击 ▾ 按钮或卡片空白都一样） */
    const lhCard = e.target.closest('.lhCard');
    if (lhCard && lhCard.classList.contains('collapsed')){
      const ev = findLive(lhCard.dataset.ev);
      if (ev) { commit(() => { ev.collapsed = false; }); UI.toast('已展开 · ' + ev.title); }
      return;
    }
    if (lhCard){
      const id = lhCard.dataset.jumpLane;
      selectEvent(id); scrollToDate(findEv(id).start, true); return;
    }

    const jump = e.target.closest('[data-jump-ev]');
    if (jump && jump.dataset.jumpEv){ RelPop.close(); selectEvent(jump.dataset.jumpEv); return; }
    if (jump) return;

    const er = e.target.closest('[data-edit-rel]'); if (er){ RelPop.close(); formEditRelation(er.dataset.editRel); return; }
    const rdet = e.target.closest('[data-rel-detail]');
    if (rdet){
      const lk = VIEW_LINKS.find(l => l.id === rdet.dataset.relDetail);
      RelPop.close();
      if (lk){ state.selected = lk.a; state.relView = lk.id; state.focusNode = null; state.attView = null; Render.all(); }
      return;
    }
    const dr = e.target.closest('[data-del-rel]');
    if (dr){ RelPop.close(); const rid = dr.dataset.delRel; UI.confirmBox('删除关系','删除这条关系线？可撤销。','删除',()=>{ if (Actions.unlink(rid)) UI.toast('关系已删除'); }); return; }

    const closeBtn = e.target.closest('#dClose');
    if (closeBtn){ state.selected = null; state.focusNode = null; state.attView = null; state.relView = null; Render.all(); return; }

    const trs = e.target.closest('[data-trash-restore]');
    if (trs){ Actions.restoreTrash(Number(trs.dataset.trashRestore)); UI.close(); UI.toast('已从回收站恢复'); return; }

    if (drawerEl.contains(e.target)){
      const relView = e.target.closest('[data-rel-view]');
      if (relView){ state.relView = relView.dataset.relView; Render.all(); return; }
      const relBack = e.target.closest('[data-rel-back]');
      if (relBack){ state.relView = null; Render.all(); return; }
      const attView = e.target.closest('[data-att-view]');
      if (attView){
        state.attView = { attId:attView.dataset.attView, kind:attView.dataset.kind, nodeId:attView.dataset.node || null };
        Render.all(); return;
      }
      const attBack = e.target.closest('[data-att-back]');
      if (attBack){ state.attView = null; Render.all(); return; }
      const attOpen = e.target.closest('[data-att-open]');
      if (attOpen){
        const u = attOpen.dataset.attOpen;
        if (/^https?:\/\//i.test(u)) window.open(u, '_blank', 'noopener');
        else UI.toast('这个附件没有可打开的网页链接');
        return;
      }
      const attCopy = e.target.closest('[data-att-copy]');
      if (attCopy){
        const u = attCopy.dataset.attCopy;
        const done = () => UI.toast('链接已复制');
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, () => fallback());
        else fallback();
        function fallback(){
          const ta = document.createElement('textarea');
          ta.value = u; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch(_){ UI.toast('复制失败，可手动选中链接'); }
          document.body.removeChild(ta);
        }
        return;
      }
      const attDel = e.target.closest('[data-att-del]');
      if (attDel){
        const kind = attDel.dataset.kind;
        const nodeId = kind === 'node' ? (state.attView ? state.attView.nodeId : state.focusNode) : null;
        Actions.detach(kind, state.selected, nodeId, attDel.dataset.attDel);
        state.attView = null;
        UI.toast('附件已删除'); return;
      }
      const act = e.target.closest('[data-act]');
      if (act){
        const id = state.selected, a = act.dataset.act;
        if (isReadOnly()){ UI.toast('回放只读'); return; }
        if (a === 'edit') formEditEvent(id);
        else if (a === 'progress'){
          const ev = findEv(id);
          formAddProgress(id, cutDate() > ev.start ? cutDate() : ev.start);
        }
        else if (a === 'branch'){
          const ev = findEv(id);
          const fn = state.focusNode && ev.nodes.find(n => n.id === state.focusNode);
          formBranch(id, fn ? fn.date : cutDate());
        }
        else if (a === 'end') formEndEvent(id);
        else if (a === 'reopen'){ Actions.reopen(id); UI.toast('已恢复为进行中'); }
        else if (a === 'link') formLink(id);
        else if (a === 'att') formAttachment('event', id);
        else if (a === 'result') formResult(id);
        else if (a === 'delete') formDeleteEvent(id);
        return;
      }
      const nback = e.target.closest('[data-nback]');
      if (nback){ state.focusNode = null; Render.all(); return; }
      const jn = e.target.closest('[data-jump-node]');
      if (jn){ selectNode(state.selected, jn.dataset.jumpNode); return; }
      const ne = e.target.closest('[data-nedit]'); if (ne){ formEditNode(state.selected, ne.dataset.nedit); return; }
      const nb = e.target.closest('[data-nbranch]'); if (nb){ const ev = findEv(state.selected); const n = ev.nodes.find(x=>x.id===nb.dataset.nbranch); if (n) formBranch(state.selected, n.date); return; }
      const na = e.target.closest('[data-natt]'); if (na){ formAttachment('node', state.selected, na.dataset.natt); return; }
      const ndel = e.target.closest('[data-ndel]'); if (ndel){ confirmDeleteNode(state.selected, ndel.dataset.ndel); return; }
      return;
    }

    if (panelEl.contains(e.target)) return;

    const cell = e.target.closest('.day-cell');
    if (cell){ if (isReadOnly()) { UI.toast('回放只读'); return; } formNewEvent(cell.dataset.date); return; }

    const nodeLbl = e.target.closest('.node-label');
    if (nodeLbl){ selectNode(nodeLbl.dataset.ev, nodeLbl.dataset.node); return; }
    const dot = e.target.closest('.node');
    if (dot){ selectNode(dot.dataset.ev, dot.dataset.node); return; }
    const chip = e.target.closest('.chip');
    if (chip){ selectEvent(chip.dataset.ev); return; }
    const endSq = e.target.closest('.mk-end') || e.target.closest('.end-cap') || e.target.closest('[data-end]');
    if (endSq){ selectEvent(endSq.dataset.ev); return; }
    const relHit = e.target.closest('.relhit');
    if (relHit){ RelPop.open(relHit.dataset.rel, e.clientX, e.clientY); return; }
    const laneOpen = e.target.closest('.lane[data-open]');
    if (laneOpen){ selectEvent(laneOpen.dataset.open); return; }
    const hitArea = e.target.closest('.hit');
    if (hitArea){
      if (isReadOnly()){ UI.toast('回放只读'); return; }
      const ev = findEv(hitArea.dataset.ev);
      const y = e.clientY - stageEl.getBoundingClientRect().top + stageEl.scrollTop;
      let d = dateAtY(y);
      if (d < ev.start) d = ev.start;
      if (ev.end && d > ev.end) d = ev.end;
      if (d > cutDate()) d = cutDate();
      formAddProgress(ev.id, d);
      return;
    }

    if (RelPop.isOpen() && !e.target.closest('.relPop')) RelPop.close();
    /* 点面板内部任意位置都不关闭：用 composedPath 判断，避免重建 DOM 后 target 已脱离文档 */
    const path = e.composedPath ? e.composedPath() : [];
    const inPanelBtn = e.target.closest('.menu-wrap') || e.target.closest('.panel') ||
      path.some(n => n && (n.id === 'panel' || (n.classList && n.classList.contains('panel')) || (n.classList && n.classList.contains('menu-wrap'))));
    if (panelEl.classList.contains('open') && !inPanelBtn) togglePanel(false);
  });

  /* --- 面板 --- */
  panelEl.addEventListener('click', e => {
    const dense = e.target.closest('[data-density]'); if (dense){ state.density = dense.dataset.density; Render.all(); return; }
    const rel = e.target.closest('[data-rel]'); if (rel){ state.relMode = rel.dataset.rel; Render.all(); return; }
    const laneAll = e.target.closest('[data-lane-all]');
    if (laneAll){
      if (isReadOnly()){ UI.toast('回放只读'); return; }
      const mode = laneAll.dataset.laneAll;
      commit(() => { EVENTS.forEach(ev => { ev.collapsed = (mode === 'collapse'); }); });
      UI.toast(mode === 'collapse' ? '已折叠全部轨道（点 ▸ 或整块卡片可展开）' : '已展开全部轨道');
      return;
    }
    const lane = e.target.closest('[data-lane]'); if (lane){ state.laneW = Math.min(2, Math.max(0, state.laneW + Number(lane.dataset.lane))); Render.all(); return; }
    const hide = e.target.closest('[data-hide-ended]'); if (hide){ state.hideEnded = !state.hideEnded; Render.all(); return; }
    const jump = e.target.closest('[data-jump]');
    if (jump){ const v = document.getElementById('jumpDate').value; if (isDate(v)){ scrollToDate(v, true); UI.toast('已跳转到 ' + ymd(v)); } return; }
    const rep = e.target.closest('[data-replay]'); if (rep){ const v = document.getElementById('replayDate').value; if (v) startReplay(v); return; }
    const exit = e.target.closest('[data-replay-exit]'); if (exit){ exitReplay(); return; }
    const chk = e.target.closest('[data-check-rel]'); if (chk){ togglePanel(false); showAudit(); return; }
    const tr = e.target.closest('[data-trash-restore]');
    if (tr){ Actions.restoreTrash(Number(tr.dataset.trashRestore)); UI.close(); UI.toast('已从回收站恢复'); return; }
    const menu = e.target.closest('[data-menu]'); if (menu){ doMenu(menu.dataset.menu); return; }
  });
  panelEl.addEventListener('change', e => {
    if (e.target.id === 'fStatus'){ state.status = e.target.value; Render.all(); }
    if (e.target.id === 'fCat'){ state.cat = e.target.value; Render.all(); }
  });

  /* --- 搜索 --- */
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', e => { state.q = e.target.value.trim(); Render.all(); });
  searchInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !state.q) return;
    const q = state.q.toLowerCase();
    const hit = Engine.LANES.find(l => l.ev.title.toLowerCase().includes(q) || l.ev.nodes.some(n => (n.title + ' ' + (n.text||'')).toLowerCase().includes(q)));
    if (hit){
      selectEvent(hit.ev.id);
      const n = hit.ev.nodes.find(x => (x.title + ' ' + (x.text||'')).toLowerCase().includes(q));
      scrollToDate(n ? n.date : hit.ev.start, true);
    } else UI.toast('没有匹配的事件');
  });

  /* --- 键盘 --- */
  document.addEventListener('keydown', e => {
    if (state.gate) return;
    const typing = ['INPUT','TEXTAREA','SELECT'].includes((e.target || {}).tagName);
    if (e.key === 'Escape'){
      if (UI.isOpen) UI.close();
      else if (RelPop.isOpen) RelPop.close();
      else if (panelEl.classList.contains('open')) togglePanel(false);
      else if (state.isolate){ state.isolate = null; Render.all(); UI.toast('已恢复显示全部事件'); }
      else if (state.selected){ state.selected = null; state.focusNode = null; Render.all(); }
      return;
    }
    if (typing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? Hist.redo() : Hist.undo(); return; }
    if (e.key === 'n' || e.key === 'N'){ if (!isReadOnly()) formNewEvent(cutDate()); return; }
    if (e.key === 't' || e.key === 'T'){ scrollToDate(cutDate(), true); return; }
    if (e.key >= '1' && e.key <= String(VIEWS.length)){ setView(Number(e.key) - 1); return; }
  });

  /* --- 日期栏悬停：整行高亮 --- */
  const gutterEl = document.getElementById('gutter');
  const bandEl = document.getElementById('hoverBand');
  let hiCell = null;
  function clearHi(){
    if (hiCell) hiCell.classList.remove('hover');
    hiCell = null;
    if (bandEl){ bandEl.style.opacity = '0'; bandEl.style.height = '0px'; }
  }
  function setHi(cell){
    const r = Engine.ROWS.find(x => x.date === cell.dataset.date);
    if (!r){ clearHi(); return; }
    if (hiCell && hiCell !== cell) hiCell.classList.remove('hover');
    hiCell = cell; cell.classList.add('hover');
    bandEl.style.top = r.top + 'px';
    bandEl.style.height = r.h + 'px';
    bandEl.style.opacity = '1';
  }
  window.tfClearRowHi = clearHi;
  gutterEl.addEventListener('mouseover', e => {
    const c = e.target.closest && e.target.closest('.day-cell');
    if (c && c !== hiCell) setHi(c);
  });
  gutterEl.addEventListener('mouseout', e => {
    const to = e.relatedTarget;
    if (to && to.closest && to.closest('.day-cell')) return;  /* 移到同栏另一天，交给 mouseover 处理 */
    if (to && gutterEl.contains(to) && !to.classList.contains('day-cell')) return;
    clearHi();
  });
  gutterEl.addEventListener('mouseleave', clearHi);

  /* --- 窗口尺寸 --- */
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => Render.all(), 180); });
})();

/* ===================== 15. 数据菜单 ===================== */
const fileInput = document.getElementById('fileInput');

function doMenu(k){
  if (k === 'account'){ togglePanel(false); Cloud.openAccount(); return; }
  if (k === 'sync-now'){ Cloud.syncNow(); return; }
  if (k === 'export') return exportData();
  if (k === 'import'){ togglePanel(false); fileInput.click(); return; }
  if (k === 'undo'){ Hist.undo(); return; }
  if (k === 'redo'){ Hist.redo(); return; }
  if (k === 'trash'){ showTrash(); return; }
  if (k === 'keys'){ showKeys(); return; }
  if (k === 'errors'){ showErrors(); return; }
  if (k === 'backup'){
    const ok = Persist.backup();
    UI.toast(ok ? '已备份到本地（键 ' + Persist.BAK + '）' : '备份失败：本地存储不可用');
    return;
  }
  if (k === 'restore-backup'){
    UI.confirmBox('从备份恢复', '会用上一次备份覆盖当前数据，建议先导出。', '恢复', () => {
      if (Persist.restoreBackup()){ Persist.save(); Render.all(); UI.toast('已从备份恢复'); }
      else UI.toast('没有可用备份');
    });
    return;
  }
  if (k === 'sample'){
    UI.confirmBox('恢复示例数据', '替换当前全部事件？可撤销（Ctrl+Z）。', '替换', () => {
      Actions.loadSample(); scrollToDate(TODAY, false); UI.toast('已恢复示例数据');
    });
    return;
  }
  if (k === 'clear'){
    UI.confirmBox('清空全部数据', '清空事件、关系与回收站？建议先导出备份，操作可撤销。', '清空', () => {
      Actions.clearAll(); UI.toast('已清空');
    });
  }
}

fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const v = Import.fromText(reader.result);
    fileInput.value = '';
    if (!v.ok){
      Log.err('导入校验失败', v.errors.join('; '));
      UI.open({ title:'导入失败（原有数据未被修改）', wide:true, okOnly:true,
        html:`<div class="dlist">${v.errors.map(x => `<div class="audit-item"><b>✕</b><span>${esc(x)}</span></div>`).join('')}</div>` });
      return;
    }
    if (v.warnings.length){
      UI.open({ title:'导入前确认', wide:true, desc:'以下内容会被规范化处理，确认后执行原子替换。', ok:'确认导入', cancel:'取消',
        html:`<div class="dlist">${v.warnings.map(x => `<div class="audit-item"><b>!</b><span>${esc(x)}</span></div>`).join('')}</div>
              <p class="modal-desc">将导入 ${v.events.length} 个事件、${(v.links||[]).length} 条关系。</p>`,
        onSubmit(){
          UI.close();
          if (Actions.replaceAll(JSON.parse(reader.result))){ scrollToDate(TODAY, false); UI.toast('已导入 ' + EVENTS.length + ' 个事件'); }
          else UI.toast('导入失败，原有数据保持不变');
        } });
      return;
    }
    const ok = Actions.replaceAll(JSON.parse(reader.result));
    if (ok){ scrollToDate(TODAY, false); UI.toast('已导入 ' + EVENTS.length + ' 个事件'); }
    else UI.toast('导入失败，原有数据保持不变');
  };
  reader.readAsText(f);
});

/* ===================== 16. 启动 ===================== */
(function init(){
  Cloud.boot();
  if (!Cloud.signedIn()) Cloud.showGate();
  const loaded = Persist.load();
  if (!loaded.ok || !EVENTS.length){
    Import.apply({ schema:'timeflow', version:3, events: clone(SAMPLE.events), links: clone(SAMPLE.links) }, true);
  }
  if (!Journal.base()) Journal.setBase();
  Engine.setView(state.view);
  refillMeta();
  Render.all();
  requestAnimationFrame(() => {
    scrollInitial();
    Cloud.afterLoad();
    if (loaded.migrated) setTimeout(() => UI.toast('已从旧版数据迁移（v' + (loaded.from === 'timeline.v1' ? 1 : 2) + ' → v3），历史数据保留'), 700);
    else if (loaded.errors && loaded.errors.length) setTimeout(() => UI.toast('载入时有 ' + loaded.errors.length + ' 条校验告警，已尽量保留数据'), 700);
  });
})();

/* 补齐派生字段（createdAt/sequence 等），保证旧数据排序稳定可追溯 */
function refillMeta(){
  EVENTS.forEach(e => {
    if (!e.createdAt) e.createdAt = TS(e.start);
    const daySeq = {};
    e.nodes.forEach(n => {
      if (!n.createdAt) n.createdAt = e.createdAt;
      daySeq[n.date] = (daySeq[n.date] || 0) + 1;
      if (!n.sequence) n.sequence = daySeq[n.date];
    });
  });
  EVENTS = sortEvents(EVENTS);
}

/* ===================== 17. 测试接口（自动化测试用） ===================== */
window.TF = {
  U, Domain, Import, Journal, Engine, Render, Actions, Persist, Log, Hist, UI, RelPop, Cloud,
  state, VIEWS, REL,
  get events(){ return EVENTS; }, get links(){ return LINKS; }, get trash(){ return TRASH; },
  get journal(){ return JOURNAL; }, get viewEvents(){ return VIEW_EVENTS; }, get viewLinks(){ return VIEW_LINKS; },
  setData(o){ Import.apply(o, true); Render.all(); },
  refresh(){ Render.all(); },
  startReplay, exitReplay, setView, commit, cutDate, findLive,
  get base(){ return BASE; },
  setBaseTime(ts){ if (BASE) BASE.at = ts; return BASE; },
  today: TODAY,
};


</script>
